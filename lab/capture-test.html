<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>駒取りの1回 — 9×9 / 40体</title>
<style>
  :root{ --ink:#e8e3d8; --dim:#8b8578; --line:rgba(232,227,216,.16);
         --hit:#c9a227; --bg:#0c0d0b; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #view{flex:1;min-height:0;position:relative}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  #stats{position:absolute;top:0;left:0;right:0;display:flex;gap:14px;
    padding:8px 10px;background:linear-gradient(#0c0d0bdd,transparent);
    font-size:11px;color:var(--dim);pointer-events:none;flex-wrap:wrap}
  #stats b{color:var(--ink);font-weight:500}

  #tray{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;
    gap:8px;padding:9px 11px;background:linear-gradient(transparent,#0c0d0bee);
    font-size:12px;color:var(--dim);pointer-events:none}
  #tray .koma{display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:25px;padding-top:2px;font-size:12px;color:#241a11;
    clip-path:polygon(50% 0,88% 15%,100% 100%,0 100%,12% 15%);
    background:linear-gradient(160deg,#f5e4bd,#d6a75e 72%,#b98437);
    transition:transform .18s ease}
  #tray.pop .koma{transform:scale(1.28)}
  #tray b{color:var(--ink);font-weight:500}

  #panel{border-top:1px solid var(--line);background:#111210;padding:10px 10px 14px;
    max-height:50vh;overflow:auto}
  .row{display:flex;gap:6px;margin-bottom:8px}
  .row:last-child{margin-bottom:0}
  button{flex:1;font:inherit;font-size:12px;color:var(--ink);background:#1a1b18;
    border:1px solid var(--line);border-radius:3px;padding:9px 4px;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  button[aria-pressed="true"]{background:#2b2718;border-color:var(--hit);color:#f4e6ae}
  button:focus-visible{outline:2px solid var(--hit);outline-offset:2px}
  #btn-take{background:#2b2718;border-color:var(--hit);color:#f4e6ae;padding:13px 4px;font-size:13px}
  .lbl{font-size:10px;letter-spacing:.14em;color:var(--dim);margin:12px 0 5px}
  .lbl:first-child{margin-top:0}
  .chk{display:flex;align-items:center;gap:7px;flex:1;font-size:11px;color:var(--dim);
    border:1px solid var(--line);border-radius:3px;padding:8px 7px;cursor:pointer}
  .chk input{accent-color:var(--hit);margin:0}
  .chk:has(input:checked){color:var(--ink);border-color:rgba(201,162,39,.5)}
  .slider{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim)}
  input[type=range]{flex:1;accent-color:var(--hit);min-width:0}
  .val{width:44px;text-align:right;color:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="stats">
      <span>fps <b id="s-fps">–</b></span>
      <span>描画呼び出し <b id="s-calls">–</b></span>
      <span>駒の高さ <b id="s-px">–</b>px</span>
    </div>
    <div id="tray">持ち駒 <span class="koma">歩</span> <b id="s-tray">×0</b></div>
  </div>

  <div id="panel">
    <div class="row"><button id="btn-take">駒を取る</button></div>
    <div class="row"><button id="btn-move">ただ動かす（比較用）</button></div>

    <div class="lbl">撃破の型</div>
    <div class="row">
      <button id="d0" aria-pressed="true">つぶれて消える</button>
      <button id="d1" aria-pressed="false">弾かれて飛ぶ</button>
      <button id="d2" aria-pressed="false">崩れて沈む</button>
    </div>

    <div class="lbl">演出の長さ</div>
    <div class="row slider">
      <input type="range" id="r-dur" min="40" max="160" value="80">
      <span class="val" id="v-dur">0.80s</span>
    </div>

    <div class="lbl">衝突の強さ</div>
    <div class="row slider">
      <input type="range" id="r-hit" min="0" max="200" value="100">
      <span class="val" id="v-hit">1.00</span>
    </div>

    <div class="lbl">要素</div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="c-shake">画面の揺れ</label>
      <label class="chk"><input type="checkbox" id="c-fly" checked>捕縛の飛行</label>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

/* ───────── 定数 ───────── */
const N = 9, SQ = 1.0, CHAR_H = 0.79, BASE = 0.70 / CHAR_H;
const TILT = 50 * Math.PI / 180;
const COLOR = [0x5f86cf, 0xd26355];        // 0=自軍(青) 1=敵軍(赤)
const SCALE = { fu:.82, kyo:.88, kei:.90, gin:.96, kin:1.00, kaku:1.03, hisha:1.06, gyoku:1.16 };
const BACK  = ['kyo','kei','gin','kin','gyoku','kin','gin','kei','kyo'];
const BONE  = { HIP:0, CHEST:1, HEAD:2, ARM_L:3, ARM_R:4 };

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const seg = (u,a,b) => clamp01((u - a) / (b - a));
const outCubic = t => 1 - Math.pow(1 - t, 3);
const inCubic  = t => t * t * t;
const outBack  = t => 1 + 2.2 * Math.pow(t-1,3) + 1.4 * Math.pow(t-1,2);

/* ───────── 素体 ───────── */
function boxPart(w,h,d,x,y,z,bone){
  const g = new THREE.BoxGeometry(w,h,d).toNonIndexed();
  g.translate(x,y,z);
  const n = g.attributes.position.count;
  const si = new Float32Array(n*4), sw = new Float32Array(n*4);
  for (let i=0;i<n;i++){ si[i*4]=bone; sw[i*4]=1; }
  g.setAttribute('skinIndex',  new THREE.BufferAttribute(si,4));
  g.setAttribute('skinWeight', new THREE.BufferAttribute(sw,4));
  return g;
}
function mergeParts(list){
  const keys={position:3,normal:3,skinIndex:4,skinWeight:4};
  let total=0; list.forEach(g=>total+=g.attributes.position.count);
  const out=new THREE.BufferGeometry();
  Object.keys(keys).forEach(k=>{
    const arr=new Float32Array(total*keys[k]); let off=0;
    list.forEach(g=>{arr.set(g.attributes[k].array,off);off+=g.attributes[k].array.length;});
    out.setAttribute(k,new THREE.BufferAttribute(arr,keys[k]));
  });
  const pos=out.attributes.position.array, flex=new Float32Array(total);
  for(let i=0;i<total;i++) flex[i]=clamp01(pos[i*3+1]/CHAR_H);
  out.setAttribute('aFlex',new THREE.BufferAttribute(flex,1));
  return out;
}
const bodyGeom = mergeParts([
  boxPart(0.17,0.28,0.14,  0.000,0.140,0, BONE.HIP),
  boxPart(0.25,0.24,0.17,  0.000,0.400,0, BONE.CHEST),
  boxPart(0.18,0.15,0.17,  0.000,0.585,0, BONE.HEAD),
  boxPart(0.05,0.14,0.14,  0.000,0.720,0, BONE.HEAD),
  boxPart(0.06,0.20,0.06, -0.150,0.360,0, BONE.ARM_L),
  boxPart(0.06,0.20,0.06,  0.150,0.360,0, BONE.ARM_R),
]);

/* ───────── 配置 ─────────
   自軍の歩を1枚だけ4筋3段目まで進めてある。その正面に敵の歩がいる。
   この1組が、駒取りの実験台。 */
const units = [];
const add = (team,file,rank,type)=>units.push({
  team, file, rank, type, scale:SCALE[type],
  phase:Math.random()*Math.PI*2, speed:0.9+Math.random()*0.25,
  jitter:0.97+Math.random()*0.06
});
for(let f=0;f<N;f++) add(1,f,0,BACK[f]);
add(1,1,1,'hisha'); add(1,7,1,'kaku');
for(let f=0;f<N;f++) add(1,f,2,'fu');
for(let f=0;f<N;f++) add(0,f,f===4?3:6,'fu');     // 4筋の歩だけ前進済み
add(0,1,7,'kaku'); add(0,7,7,'hisha');
for(let f=0;f<N;f++) add(0,f,8,BACK[f]);

const ATK = units.findIndex(u=>u.team===0 && u.rank===3);
const VIC = units.findIndex(u=>u.team===1 && u.rank===2 && u.file===4);
const HOME = { atk:{f:4,r:3}, vic:{f:4,r:2} };

const wx = f => (f-(N-1)/2)*SQ;
const wz = r => (r-(N-1)/2)*SQ;

/* ───────── 場面 ───────── */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0d0b);
scene.fog = new THREE.Fog(0x0c0d0b, 14, 26);
const camera = new THREE.PerspectiveCamera(34,1,0.5,60);
const TARGET = new THREE.Vector3(0,0.35,0.4);
const camBase = new THREE.Vector3();

scene.add(new THREE.HemisphereLight(0xbfd4e8,0x30281c,0.85));
const sun = new THREE.DirectionalLight(0xfff0d0,0.85);
sun.position.set(3.5,8,4); scene.add(sun);

const board = new THREE.Mesh(new THREE.BoxGeometry(N*SQ,0.18,N*SQ),
  new THREE.MeshLambertMaterial({color:0x6b7a4c}));
board.position.y=-0.09; scene.add(board);
{
  const pts=[], half=N*SQ/2;
  for(let i=0;i<=N;i++){ const p=-half+i*SQ;
    pts.push(-half,0.002,p, half,0.002,p); pts.push(p,0.002,-half, p,0.002,half); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  scene.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({
    color:0xe8dcb0,transparent:true,opacity:0.30})));
}

/* ───────── 待機の揺れ（骨なし・頂点シェーダ） ───────── */
const uTime={value:0}, uAmp={value:1};
function wobbleMaterial(color){
  const m=new THREE.MeshLambertMaterial({color});
  m.onBeforeCompile=sh=>{
    sh.uniforms.uTime=uTime; sh.uniforms.uAmp=uAmp;
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>',`#include <common>
        attribute float aPhase; attribute float aSpeed; attribute float aFlex;
        uniform float uTime; uniform float uAmp;`)
      .replace('#include <begin_vertex>',`#include <begin_vertex>
        {
          float t = uTime * aSpeed + aPhase;
          float f = aFlex * aFlex;
          transformed.y += sin(t*2.20) * 0.030 * uAmp;
          transformed.x += sin(t*1.70) * 0.055 * f * uAmp;
          transformed.z += sin(t*1.30+1.1) * 0.035 * f * uAmp;
        }`);
  };
  return m;
}

const inst = [0,1].map(team=>{
  const idx = units.map((u,i)=>u.team===team?i:-1).filter(i=>i>=0);
  const g = bodyGeom.clone();
  const phase=new Float32Array(idx.length), speed=new Float32Array(idx.length);
  idx.forEach((ui,k)=>{ phase[k]=units[ui].phase; speed[k]=units[ui].speed; });
  g.setAttribute('aPhase',new THREE.InstancedBufferAttribute(phase,1));
  g.setAttribute('aSpeed',new THREE.InstancedBufferAttribute(speed,1));
  const mesh=new THREE.InstancedMesh(g,wobbleMaterial(COLOR[team]),idx.length);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled=false; scene.add(mesh);
  return {mesh, idx, slot:new Map(idx.map((ui,k)=>[ui,k]))};
});

/* ───────── 捕縛の駒（飛んでいく1個） ───────── */
const tokenMat = new THREE.MeshLambertMaterial({color:COLOR[1]});
const token = new THREE.Mesh(new THREE.BoxGeometry(0.30,0.34,0.10), tokenMat);
token.visible=false; scene.add(token);
const TRAY = new THREE.Vector3(0, 0.55, N*SQ/2 + 1.35);   // 自陣手前＝持ち駒置き場

/* ───────── 各体の上書き状態 ───────── */
const ov = new Map();      // unitIndex -> {p,r,s,hide}
const dummy = new THREE.Object3D();

function refresh(){
  inst.forEach(g=>{
    g.idx.forEach((ui,k)=>{
      const u=units[ui], o=ov.get(ui);
      const s=BASE*u.scale*u.jitter;
      if(o && o.hide){ dummy.scale.setScalar(0); dummy.position.set(0,-99,0); dummy.rotation.set(0,0,0); }
      else{
        dummy.position.set(o?o.p.x:wx(u.file), o?o.p.y:0, o?o.p.z:wz(u.rank));
        dummy.rotation.set(o?o.r.x:0, (u.team===1?Math.PI:0)+(o?o.r.y:0), o?o.r.z:0);
        dummy.scale.set(s*(o?o.s.x:1), s*(o?o.s.y:1), s*(o?o.s.z:1));
      }
      dummy.updateMatrix();
      g.mesh.setMatrixAt(k, dummy.matrix);
    });
    g.mesh.instanceMatrix.needsUpdate=true;
  });
}

/* ───────── 演出の設定 ───────── */
const cfg = { style:0, dur:0.80, hit:1.00, shake:false, fly:true };
let seq = null, shake = 0, captured = 0;

function reset(){
  ov.clear();
  units[ATK].file=HOME.atk.f; units[ATK].rank=HOME.atk.r;
  units[VIC].file=HOME.vic.f; units[VIC].rank=HOME.vic.r;
  token.visible=false;
  refresh();
}

function startCapture(){
  reset();
  seq = { kind:'take', t:0, counted:false };
}
function startMove(){
  reset();
  seq = { kind:'move', t:0 };
}

/* ───────── 駒取りの時間割 ─────────
   0.00–0.40 進軍（弧を描いて7割まで）
   0.40–0.50 踏み込み → 0.50 で衝突
   0.50–0.62 攻撃側の戻り
   0.50–0.78 被撃破側の演出
   0.56–0.92 捕縛の駒が持ち駒へ飛ぶ            */

function updateCapture(u){
  const a = units[ATK], v = units[VIC];
  const ax0=wx(a.file), az0=wz(a.rank);
  const ax1=wx(v.file), az1=wz(v.rank);
  const H = cfg.hit;

  /* 攻撃側 */
  let k;
  if(u < 0.40){ k = outCubic(seg(u,0,0.40)) * 0.70; }
  else if(u < 0.50){ k = 0.70 + inCubic(seg(u,0.40,0.50)) * 0.42; }   // 少し行き過ぎる
  else { k = 1.12 - outBack(seg(u,0.50,0.62)) * 0.12; }
  const hop = u<0.40 ? Math.sin(seg(u,0,0.40)*Math.PI)*0.20 : 0;
  const lean = (u>=0.40 && u<0.62) ? Math.sin(seg(u,0.40,0.62)*Math.PI)*0.30*H : 0;
  ov.set(ATK,{
    p:{ x:ax0+(ax1-ax0)*k, y:hop, z:az0+(az1-az0)*k },
    r:{ x:-lean, y:0, z:0 },
    s:{ x:1,y:1,z:1 }
  });

  /* 被撃破側 */
  if(u < 0.50){
    const brace = u>0.36 ? Math.sin(seg(u,0.36,0.50)*Math.PI)*0.10*H : 0;
    ov.set(VIC,{ p:{x:ax1,y:0,z:az1}, r:{x:brace,y:0,z:0}, s:{x:1,y:1,z:1} });
  } else {
    const d = seg(u,0.50,0.78);
    const o = { p:{x:ax1,y:0,z:az1}, r:{x:0,y:0,z:0}, s:{x:1,y:1,z:1}, hide:d>=1 };
    if(cfg.style===0){                                   // つぶれて消える
      const sq = outCubic(d);
      o.s.y = 1 - sq*0.95;
      o.s.x = o.s.z = 1 + Math.sin(d*Math.PI)*0.55*H - sq*0.55;
    } else if(cfg.style===1){                            // 弾かれて飛ぶ
      const e = d;
      o.p.z = az1 - e*2.4*H;
      o.p.y = Math.sin(e*Math.PI)*1.5*H;
      o.r.x = -e*7.0; o.r.y = e*4.0;
      o.s.x=o.s.y=o.s.z = 1-inCubic(e);
    } else {                                             // 崩れて沈む
      const e = outCubic(d);
      o.r.x = -e*Math.PI/2;
      o.p.y = -e*0.45;
      o.s.x=o.s.y=o.s.z = 1-e*0.45;
      if(d>0.8) o.s.x=o.s.y=o.s.z = (1-0.45*e)*(1-seg(d,0.8,1));
    }
    ov.set(VIC,o);
  }

  /* 捕縛の駒 */
  if(cfg.fly && u>=0.56 && u<0.94){
    const e = seg(u,0.56,0.94), ee = outCubic(e);
    token.visible = true;
    token.position.set(
      ax1 + (TRAY.x-ax1)*ee,
      0.35 + Math.sin(e*Math.PI)*1.1 + (TRAY.y-0.35)*ee,
      az1 + (TRAY.z-az1)*ee
    );
    token.rotation.set(0, e*Math.PI*2.2, 0);
    const s = 1 - inCubic(e)*0.55;
    token.scale.setScalar(s);
    tokenMat.color.setHex(COLOR[1]).lerp(new THREE.Color(COLOR[0]), clamp01(e*1.6));
  } else if(u>=0.94){
    token.visible = false;
  }

  /* 衝突の瞬間 */
  if(u>=0.50 && !seq.counted){
    seq.counted = true;
    if(cfg.shake) shake = 0.16*cfg.hit;
  }
  if(cfg.fly && u>=0.92 && !seq.trayed){ seq.trayed = true; bumpTray(); }
  if(!cfg.fly && u>=0.78 && !seq.trayed){ seq.trayed = true; bumpTray(); }
}

function updateMove(u){
  const a = units[ATK];
  const k = outCubic(u);
  ov.set(ATK,{
    p:{ x:wx(a.file), y:Math.sin(u*Math.PI)*0.20, z:wz(a.rank)+(wz(a.rank-1)-wz(a.rank))*k },
    r:{x:0,y:0,z:0}, s:{x:1,y:1,z:1}
  });
}

const trayEl = document.getElementById('tray');
const trayNum = document.getElementById('s-tray');
function bumpTray(){
  captured++; trayNum.textContent = '×'+captured;
  trayEl.classList.add('pop');
  setTimeout(()=>trayEl.classList.remove('pop'), 190);
}

/* ───────── 表示サイズ ───────── */
const pA=new THREE.Vector3(), pB=new THREE.Vector3();
const charPixels = () => {
  pA.set(0,0,0).project(camera); pB.set(0,CHAR_H*BASE,0).project(camera);
  return Math.abs(pA.y-pB.y)/2*renderer.domElement.clientHeight;
};

/* ───────── 画面合わせ ───────── */
function resize(){
  const w=view.clientWidth, h=view.clientHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h;
  const halfW=N*SQ/2+0.35;
  const vFov=camera.fov*Math.PI/180;
  const hFov=2*Math.atan(Math.tan(vFov/2)*camera.aspect);
  const dist=Math.max(halfW/Math.tan(hFov/2),
                      (N*SQ/2*Math.cos(TILT)+1.6)/Math.tan(vFov/2));
  camBase.set(TARGET.x, TARGET.y+dist*Math.sin(TILT), TARGET.z+dist*Math.cos(TILT));
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ───────── 操作 ───────── */
document.getElementById('btn-take').addEventListener('click', ()=>{ if(!seq) startCapture(); });
document.getElementById('btn-move').addEventListener('click', ()=>{ if(!seq) startMove(); });

const dBtn=[document.getElementById('d0'),document.getElementById('d1'),document.getElementById('d2')];
dBtn.forEach((b,i)=>b.addEventListener('click',()=>{
  cfg.style=i; dBtn.forEach((x,j)=>x.setAttribute('aria-pressed',String(i===j)));
}));

document.getElementById('r-dur').addEventListener('input',e=>{
  cfg.dur=e.target.value/100;
  document.getElementById('v-dur').textContent=cfg.dur.toFixed(2)+'s';
});
document.getElementById('r-hit').addEventListener('input',e=>{
  cfg.hit=e.target.value/100;
  document.getElementById('v-hit').textContent=cfg.hit.toFixed(2);
});
document.getElementById('c-shake').addEventListener('change',e=>cfg.shake=e.target.checked);
document.getElementById('c-fly').addEventListener('change',e=>cfg.fly=e.target.checked);

/* ───────── ループ ───────── */
const el={fps:document.getElementById('s-fps'),calls:document.getElementById('s-calls'),
          px:document.getElementById('s-px')};
let last=performance.now(), acc=0, frames=0;
const clock=new THREE.Clock();

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  uTime.value=clock.getElapsedTime();

  if(seq){
    seq.t += dt / (seq.kind==='move' ? 0.35 : cfg.dur);
    const u=Math.min(seq.t,1);
    if(seq.kind==='take') updateCapture(u); else updateMove(u);
    if(seq.t>=1){
      if(seq.kind==='take'){ ov.delete(ATK); units[ATK].rank=HOME.vic.r; ov.set(VIC,{hide:true,p:{x:0,y:0,z:0},r:{x:0,y:0,z:0},s:{x:1,y:1,z:1}}); }
      else { ov.delete(ATK); units[ATK].rank -= 1; }
      seq=null;
    }
    refresh();
  }

  if(shake>0){
    shake=Math.max(0, shake-dt*1.3);
    camera.position.set(
      camBase.x+(Math.random()-0.5)*shake,
      camBase.y+(Math.random()-0.5)*shake,
      camBase.z+(Math.random()-0.5)*shake);
  } else camera.position.copy(camBase);
  camera.lookAt(TARGET);

  renderer.render(scene,camera);

  frames++;
  const now=performance.now(); acc+=now-last; last=now;
  if(acc>=500){
    el.fps.textContent=Math.round(frames*1000/acc);
    el.calls.textContent=renderer.info.render.calls;
    el.px.textContent=charPixels().toFixed(1);
    acc=0; frames=0;
  }
}

resize(); refresh(); loop();
</script>
</body>
</html>
