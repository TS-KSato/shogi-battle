<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>将棋 — 人間 対 NPC</title>
<style>
  :root{ --ink:#e8e3d8; --dim:#8b8578; --line:rgba(232,227,216,.16);
         --hit:#c9a227; --bg:#0c0d0b; --panel:#111210; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-text-size-adjust:100%}
  /* viewport-fit=cover なので、四辺は safe-area のぶん逃がす。 */
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;
    padding:calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
            calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
  main{width:100%;max-width:320px}

  h1{font-size:20px;font-weight:500;letter-spacing:.14em;margin:0 0 4px}
  .lead{color:var(--dim);font-size:11px;margin:0 0 30px;line-height:1.8}

  .row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .row label{flex:0 0 3.5em;color:var(--dim);font-size:11px}
  select{flex:1;min-width:0;font:inherit;font-size:12px;color:var(--ink);background:#1a1b18;
    border:1px solid var(--line);border-radius:3px;padding:8px 6px;min-height:44px;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  button{width:100%;margin-top:14px;font:inherit;font-size:14px;letter-spacing:.08em;
    color:#f4e6ae;background:#2b2718;border:1px solid var(--hit);border-radius:3px;
    padding:12px 6px;min-height:52px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  select:focus-visible,button:focus-visible{outline:2px solid var(--hit);outline-offset:2px}

  /* 開発用。公開時にこの footer ごと消す。 */
  footer{margin-top:34px;border-top:1px solid var(--line);padding-top:10px}
  footer p{margin:0 0 4px;color:var(--dim);font-size:10px;letter-spacing:.08em}
  footer a{display:inline-block;margin-right:12px;padding:4px 0;
    color:var(--dim);font-size:10px;text-decoration:none}
  footer a:hover,footer a:focus-visible{color:var(--hit);outline:none}
  /* ── 見た目B（比較用）──────────────────────────────────────
     色と書体だけを上書きする。寸法・余白・配置・当たり判定は a と同じに保つ。
     案が決まったらこのブロックと head の切り替えスクリプトごと消す。 */
  html[data-ui="b"]{ --bg:#14110c; --panel:#1b1710; --ink:#ede3cd; --dim:#9a8f78;
                     --line:rgba(201,162,39,.28) }
  html[data-ui="b"] select{background:#221c12}
  html[data-ui="b"] button{background:#33291a}
  /* 明朝は表題だけ。11〜13pxの明朝は細って読めないので、操作系と数字は等幅のまま。 */
  html[data-ui="b"] h1{font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
</style>
<script>
  // 見た目の2案を見比べるための仮の仕掛け。既定は a（現状のまま）。案が決まったら消す。
  { const u = new URLSearchParams(location.search).get('ui');
    if (u === 'b') document.documentElement.dataset.ui = 'b'; }
</script>
</head>
<body>
<main>
  <h1>将棋</h1>
  <p class="lead">盤の上の駒ではなく、野に並ぶ兵として指す。</p>

  <div class="row">
    <label for="side">手番</label>
    <select id="side">
      <option value="0" selected>先手（手前）</option>
      <option value="1">後手（奥）</option>
    </select>
  </div>
  <div class="row">
    <label for="level">強さ</label>
    <select id="level">
      <option value="easy">やさしい</option>
      <option value="normal" selected>ふつう</option>
      <option value="hard">つよい</option>
    </select>
  </div>
  <!-- 見た目の2案を見比べるための仮置き。案が決まったらこの行と b の指定を消す。 -->
  <div class="row">
    <label for="ui">見た目</label>
    <select id="ui">
      <option value="a" selected>A</option>
      <option value="b">B</option>
    </select>
  </div>
  <button id="start">対局する</button>

  <footer>
    <p>開発用</p>
    <a href="./play.html">2D盤面</a>
    <a href="./lab/idle-test.html">待機モーション</a>
    <a href="./lab/capture-test.html">駒取り演出</a>
  </footer>
</main>

<script>
const ui = document.getElementById('ui');
ui.value = document.documentElement.dataset.ui === 'b' ? 'b' : 'a';
ui.addEventListener('change', () => {              // 選んだ見た目をこの画面にも即座に効かせる
  if (ui.value === 'b') document.documentElement.dataset.ui = 'b';
  else document.documentElement.removeAttribute('data-ui');
});
document.getElementById('start').addEventListener('click', () => {
  const side = document.getElementById('side').value;
  const level = document.getElementById('level').value;
  location.href = `./play3d.html?side=${side}&level=${level}&ui=${ui.value}`;
});
</script>
</body>
</html>
