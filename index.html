<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{ --ink:#e8e3d8; --dim:#8b8578; --line:rgba(232,227,216,.16);
         --hit:#c9a227; --bg:#0c0d0b; --panel:#111210; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-text-size-adjust:100%}
  /* 戦場の絵を画面いっぱいに敷く。絵が無ければ背景色が残るだけ。
     viewport-fit=cover なので、四辺は safe-area のぶん逃がす。 */
  body{background:var(--bg) url("./assets/title.jpg") center/cover no-repeat;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;
    padding:calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
            calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
  main{position:relative;width:100%;max-width:320px}
  /* 絵が読めたときだけ下半分へ寄せ、文字の下地として暗くする。読めなければ中央のまま。 */
  html.art body{justify-content:flex-end}
  html.art body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(to bottom,transparent 30%,rgba(12,13,11,.50) 50%,
      rgba(12,13,11,.88) 72%,rgba(12,13,11,.95) 100%)}
  h1{font-size:20px;font-weight:500;letter-spacing:.14em;margin:0 0 4px;text-align:center}
  #logo{display:none;width:65vw;max-width:100%;height:auto;margin:0 auto}
  html.logo #logo{display:block}
  html.logo #titleText{display:none}
  .lead{color:var(--dim);font-size:11px;margin:0 0 30px;line-height:1.8;text-align:center}

  .row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .row label{flex:0 0 3.5em;color:var(--dim);font-size:11px}
  select{flex:1;min-width:0;font:inherit;font-size:12px;color:var(--ink);background:#1a1b18;
    border:1px solid var(--line);border-radius:3px;padding:8px 6px;min-height:44px;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  button{width:100%;margin-top:14px;font:inherit;font-size:14px;letter-spacing:.08em;
    color:#f4e6ae;background:#2b2718;border:1px solid var(--hit);border-radius:3px;
    padding:12px 6px;min-height:52px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  select:focus-visible,button:focus-visible{outline:2px solid var(--hit);outline-offset:2px}

  /* ガイドの4つの入口。出陣の下に小さく並べる。 */
  .guide{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:22px}
  .guide a{display:flex;align-items:center;justify-content:center;min-height:44px;padding:6px 2px;
    color:var(--dim);font-size:11px;letter-spacing:.04em;text-decoration:none;
    border:1px solid var(--line);border-radius:3px;-webkit-tap-highlight-color:transparent}
  .guide a:hover,.guide a:focus-visible{color:var(--hit);border-color:var(--hit);outline:none}
</style>
</head>
<body>
<main>
  <h1 id="title"><span id="titleText"></span><img id="logo" src="./assets/logo.png" alt=""></h1>
  <p class="lead">兵を率いて、敵の大将を追い詰めろ。</p>

  <div class="row">
    <label for="side">順番</label>
    <select id="side">
      <option value="0" selected>先攻</option>
      <option value="1">後攻</option>
    </select>
  </div>
  <div class="row">
    <label for="level">強さ</label>
    <select id="level">
      <option value="easy">やさしい</option>
      <option value="normal" selected>ふつう</option>
      <option value="hard">つよい</option>
    </select>
  </div>
  <button id="start">出陣する</button>

  <div class="guide">
    <a href="./guide.html#hei">兵</a>
    <a href="./guide.html#rule">ルール</a>
    <a href="./guide.html#sousa">操作</a>
    <a href="./guide.html#komatta">困ったとき</a>
  </div>
</main>

<script type="module">
import { GAME_NAME } from './src/name.js';
document.title = GAME_NAME;
document.getElementById('titleText').textContent = GAME_NAME;
// ロゴが読めたときだけ画像の見出しにする。読めなければ文字のまま
{ const logo = document.getElementById('logo');
  logo.alt = GAME_NAME;
  const show = () => document.documentElement.classList.add('logo');
  if (logo.complete && logo.naturalWidth) show(); else logo.onload = show;   // 読み終えた後に script が動くこともある
}
// 戦場の絵が読めたときだけ、下半分に寄せる配置へ切り替える（CSS の背景と同じ URL なので取得は1回）
{ const art = new Image(); art.onload = () => document.documentElement.classList.add('art'); art.src = './assets/title.jpg'; }
document.getElementById('start').addEventListener('click', () => {
  const side = document.getElementById('side').value;
  const level = document.getElementById('level').value;
  location.href = `./play3d.html?side=${side}&level=${level}`;
});

/* 対局画面が最初に読む兵のモデルと舞台絵を、この画面のうちに先読みしておく。
   prefetch は HTTP キャッシュに入るので、play3d.html の GLTFLoader の取得がそれを使う。 */
{
  const files = ['stage/honjin.jpg', 'nobori_blue.glb', 'nobori_red.glb', 'taiho.glb'];
  for (const side of ['blue', 'red']){
    for (const n of ['fu','kyo','kei','gin','kin','kaku','hisha','gyoku']) files.push(`${n}_${side}_idle.glb`);
    for (const n of ['kaku','hisha']) files.push(`${n}_${side}_promoted.glb`);
  }
  for (const f of files){
    const l = document.createElement('link'); l.rel = 'prefetch'; l.href = `./assets/${f}`;
    document.head.appendChild(l);
  }
}
</script>
</body>
</html>
