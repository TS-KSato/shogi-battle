<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>将棋 — 人間 対 NPC（3D）</title>
<style>
  :root{ --ink:#e8e3d8; --dim:#8b8578; --line:rgba(232,227,216,.16);
         --hit:#c9a227; --bg:#0c0d0b; --panel:#111210; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #view{flex:1;min-height:0;position:relative}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* 手番の行。下部パネルの最上段。右端は退避手の表示。 */
  #turnRow{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:6px}
  #turn{color:var(--ink);white-space:nowrap} #turn.check{color:#e0653f}
  #info{color:var(--dim);font-size:11px;text-align:right}   /* 長い知らせは折り返して全文を出す */
  /* 戦闘ログ。直近5行だけを持ち駒の上に出し、押すと全履歴のシートを開く。
     行の高さを固定して、空でも1行でも枠の高さが変わらないようにする。 */
  #log{border:1px solid var(--line);border-radius:3px;padding:5px 8px;margin-bottom:9px;
    font-size:11px;line-height:1.55;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #log div{height:1.55em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--dim)}
  #log div:last-child{color:var(--ink)}
  #logList{max-height:40vh;overflow-y:auto;text-align:left;font-size:12px;line-height:1.6;
    margin-bottom:10px;color:var(--ink)}
  #logClose{width:100%}

  /* 下部の自分の持ち駒。盤上と同じ兵の姿に、足元へ小さく漢字を添える。
     敵の持ち駒は 3D 空間（奥の地面）に出すので、上部の帯は置かない。 */
  /* 兵の絵の大きさは変えず、指で押せるよう当たりを44px角に広げる。 */
  .koma{position:relative;width:44px;height:44px;cursor:pointer;
    background-image:var(--sol-me);background-size:auto 30px;
    background-repeat:no-repeat;background-position:center top}
  .koma .k{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    font-size:10px;font-weight:700;line-height:1.25;padding:0 2px;border-radius:2px;
    color:#241a11;background:rgba(245,230,190,.9);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;pointer-events:none}
  .koma .n{position:absolute;right:-4px;top:-3px;font-size:9px;color:var(--hit);
    background:var(--bg);border-radius:6px;padding:0 3px;line-height:1.5;
    font-family:ui-monospace,monospace}
  .koma.sel{outline:2px solid var(--hit);outline-offset:2px;border-radius:3px}
  #handBottom .empty{color:var(--dim);font-size:11px;padding:0 6px}

  /* viewport-fit=cover なので、左右と下は safe-area のぶん逃がす。 */
  #panel{border-top:1px solid var(--line);background:var(--panel);
    padding:9px calc(10px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom))
            calc(10px + env(safe-area-inset-left))}
  .myhand{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:31px;
    margin-bottom:9px;font-size:11px;color:var(--dim)}
  .controls{display:flex;flex-wrap:wrap;gap:6px}
  .grp{display:flex;gap:6px;flex:1;min-width:0}
  button,select{font:inherit;font-size:12px;color:var(--ink);background:#1a1b18;
    border:1px solid var(--line);border-radius:3px;padding:8px 6px;cursor:pointer;
    min-height:44px;-webkit-tap-highlight-color:transparent}
  select{flex:1;min-width:0}
  button.primary{background:#2b2718;border-color:var(--hit);color:#f4e6ae;flex:1}
  button.ghost{flex:1}
  button:focus-visible,select:focus-visible{outline:2px solid var(--hit);outline-offset:2px}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:10}
  .overlay.on{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:18px;max-width:300px;width:100%;text-align:center}
  .card p{margin:0 0 14px;font-size:13px}
  .card .big{font-size:16px;color:var(--hit);letter-spacing:.06em;margin-bottom:6px}
  .rowb{display:flex;gap:8px}.rowb button{flex:1}
  /* 成り確認だけは下部シート。成るとどう変わるかを盤で見て選べるよう、盤は覆わず暗くしない。 */
  .overlay.sheet{background:none;align-items:flex-end;padding:0}
  .overlay.sheet .card{max-width:none;border-radius:6px 6px 0 0;padding:14px}
  .overlay.sheet .rowb button{padding:10px 4px;font-size:11px}
  .overlay.sheet .card p{margin-bottom:6px}
  .overlay.sheet .legend{font-size:10px;color:var(--dim);margin-bottom:12px}
  /* 選んだ側は、その側が盤に出る色で縁取る。 */
  #promoYes.pick{border-color:#b07bd8}
  #promoNo.pick{border-color:#f0ece0}
  #promoGo{width:100%;margin-top:8px;padding:10px}
  #promoGo:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <div id="panel">
    <div id="turnRow"><span id="turn">読み込み中…</span><span id="info"></span></div>
    <div id="log"><div></div><div></div><div></div><div></div><div></div></div>
    <div class="myhand" id="handBottom"></div>
    <div class="controls">
      <div class="grp">
        <button class="primary" id="newGame">新規対局</button>
        <button class="ghost" id="resign">投了</button>
        <button class="ghost" id="reset" title="ズームを解除して等倍に戻す" hidden>ズーム解除</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay sheet" id="promoOv"><div class="card">
  <p>進化させますか？</p>
  <p class="legend">押すと、その場合に行ける先が盤に出ます</p>
  <div class="rowb"><button id="promoYes">進化する</button><button id="promoNo">進化しない</button></div>
  <button id="promoGo" class="primary" disabled>この手で指す</button>
</div></div>

<div class="overlay sheet" id="logOv"><div class="card">
  <p>戦闘ログ</p>
  <div id="logList"></div>
  <button id="logClose" class="primary">閉じる</button>
</div></div>

<div class="overlay" id="resultOv"><div class="card">
  <p class="big" id="resultBig"></p><p id="resultSub"></p>
  <div class="rowb"><button id="resultClose" class="primary">閉じる</button><button id="resultTitle">タイトルへ</button></div>
</div></div>

<!-- 盤面の描画は lab/idle-test.html と同じ Three.js。GitHub Pages では CDN 直リンクで届く。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- スキン付きGLBの読み込みと複製に使う。届かなければ骨なしGLBへ退避する。 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script type="module">
import {
  START_SFEN, parseSfen, toSfen, legalMoves, clone,
  doMove, moveToUsi, usiToMove,
  moveTo, moveFrom, movePro, isDrop, dropType,
  colorOf, typeOf, baseOf, col, row, inCheck, positionKey, repetition,
  BLACK, WHITE, EMPTY, FU, KY, KE, GI, KI, KA, HI, TO, NY, NK, NG, UM, RY,
} from './src/shogi.js';
import { Npc } from './src/npc.js';

/* ═════════ ルール層まわりの表記（play.html と共通） ═════════ */
const KANJI = [];
KANJI[0]='歩';KANJI[1]='香';KANJI[2]='桂';KANJI[3]='銀';KANJI[4]='金';
KANJI[5]='角';KANJI[6]='飛';KANJI[7]='玉';
KANJI[8]='と';KANJI[9]='杏';KANJI[10]='圭';KANJI[11]='全';KANJI[13]='馬';KANJI[14]='龍';
const HAND_ORDER = [HI, KA, KI, GI, KE, KY, FU];

/* 段の表記（戦闘ログの座標と盤の目盛り）。 */
const RANK_KANJI = ['一','二','三','四','五','六','七','八','九'];

/* 戦闘ログの駒名。兵の姿に合わせた呼び名で、進化した駒は「歩兵（進化）」と付ける。 */
const LOG_NAME = ['歩兵','槍兵','忍者','侍','近衛兵','僧兵','鉄砲兵','大将'];
const logName = t => LOG_NAME[baseOf(t)] + (t === baseOf(t) ? '' : '（進化）');
/* 指す直前の局面 p と指し手 mv から戦闘ログの1文を作る（表現層の処理。王手は
   指した後の局面で分かるので、呼び出し側が文末に足す）。人間側が「自軍」。
   前後は指した側から見る。敵軍の歩兵が手前へ来るのも、その兵にとっては「進む」。 */
function logLine(p, mv){
  const to = moveTo(mv), side = p.turn === humanColor ? '自軍' : '敵軍';
  const dest = (9 - col(to)) + RANK_KANJI[row(to)];
  if (isDrop(mv)) return `${side}が${dest}へ${logName(dropType(mv))}を投入`;
  const from = moveFrom(mv), t = typeOf(p.board[from]);
  const other = side === '自軍' ? '敵軍' : '自軍';
  let s;
  if (p.board[to] !== EMPTY){
    s = `${side}の${logName(t)}が${dest}の${other}の${logName(typeOf(p.board[to]))}を討つ`;
  } else {
    const ahead = (row(to) - row(from)) * (p.turn === BLACK ? -1 : 1);   // 指した側から見た前進量
    const verb = t === KE ? '跳ぶ' : ahead > 0 ? '進む' : ahead < 0 ? '下がる' : '移る';
    s = `${side}の${logName(t)}が${dest}へ${verb}`;
  }
  return movePro(mv) ? s + '、進化' : s;
}

/* ═════════ 3D 定数（lab/idle-test.html を流用） ═════════ */
const N = 9, SQ = 1.0, CHAR_H = 0.79, BASE = 0.70 / CHAR_H;
const TILT = 35 * Math.PI / 180;   // 俯角35度固定。横から見て駒の姿を見せる
const LENS = 0.42;                 // 上下のレンズシフト。盤を下へ寄せ、空きを上（空）へ集める
                                   // （下げ過ぎると手前の持ち駒が画面外に切れるので程々に）
const COLOR = [0x5f86cf, 0xd26355];            // 0=自軍(青・手前) 1=敵軍(赤・奥)
/* 駒種ごとの大きさ。識別用ではなく、集団が単一コピーに見えるのを防ぐため。 */
const SCALE = { fu:.82, kyo:.88, kei:.90, gin:.96, kin:1.00, kaku:1.03, hisha:1.06, gyoku:1.16 };
const BASE_NAME = ['fu','kyo','kei','gin','kin','kaku','hisha','gyoku'];
const scaleOf = t => SCALE[BASE_NAME[baseOf(t)]];

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const seg = (u,a,b) => clamp01((u - a) / (b - a));
const outCubic = t => 1 - Math.pow(1 - t, 3);
const inCubic  = t => t * t * t;
const outBack  = t => 1 + 2.2 * Math.pow(t-1,3) + 1.4 * Math.pow(t-1,2);

/* ═════════ 素体（骨は使わない。頂点シェーダで揺らすだけ） ═════════ */
function boxPart(w,h,d,x,y,z){
  const g = new THREE.BoxGeometry(w,h,d).toNonIndexed();
  g.translate(x,y,z);
  return g;
}
function mergeParts(list){
  let total = 0; list.forEach(g => total += g.attributes.position.count);
  const out = new THREE.BufferGeometry();
  ['position','normal'].forEach(k => {
    const arr = new Float32Array(total*3); let off = 0;
    list.forEach(g => { arr.set(g.attributes[k].array, off); off += g.attributes[k].array.length; });
    out.setAttribute(k, new THREE.BufferAttribute(arr, 3));
  });
  // aFlex: 足元0 → 頭頂1。揺れを「上ほど大きく」するために使う。
  const pos = out.attributes.position.array, flex = new Float32Array(total);
  for (let i = 0; i < total; i++) flex[i] = clamp01(pos[i*3+1] / CHAR_H);
  out.setAttribute('aFlex', new THREE.BufferAttribute(flex, 1));
  return out;
}
const bodyGeom = mergeParts([
  boxPart(0.17,0.28,0.14,  0.000,0.140,0),   // 脚・腰
  boxPart(0.25,0.24,0.17,  0.000,0.400,0),   // 胴
  boxPart(0.18,0.15,0.17,  0.000,0.585,0),   // 頭
  boxPart(0.05,0.14,0.14,  0.000,0.720,0),   // 前立
  boxPart(0.06,0.20,0.06, -0.150,0.360,0),   // 左腕
  boxPart(0.06,0.20,0.06,  0.150,0.360,0),   // 右腕
]);

/* 足元の影は canvas で作る（外部画像を持たない）。 */
function makeShadowTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 1, 32, 32, 30);
  grd.addColorStop(0, 'rgba(0,0,0,0.5)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

/* GLB を最小限に読む（骨なし・単一プリミティブ前提）。GLTFLoader を足さず、
   同一オリジンの相対パスで取得する。失敗時は呼び出し側で箱の素体へ退避する。 */
async function loadGLB(url){
  const buf = await (await fetch(url)).arrayBuffer();
  const dv = new DataView(buf);
  if (dv.getUint32(0, true) !== 0x46546C67) throw new Error('not glb');
  let json = null, binOff = 0, p = 12;
  while (p < dv.byteLength){
    const len = dv.getUint32(p, true), type = dv.getUint32(p+4, true); p += 8;
    if (type === 0x4E4F534A) json = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, p, len)));
    else if (type === 0x004E4942) binOff = p;
    p += len;
  }
  const CT = { 5126: Float32Array, 5123: Uint16Array, 5125: Uint32Array };
  const NUM = { SCALAR:1, VEC2:2, VEC3:3 };
  const read = idx => {                            // アクセサをコピーで取り出す（整列に依存しない）
    const a = json.accessors[idx], bv = json.bufferViews[a.bufferView];
    const off = binOff + (bv.byteOffset||0) + (a.byteOffset||0);
    const Ctor = CT[a.componentType];
    return new Ctor(buf.slice(off, off + a.count * NUM[a.type] * Ctor.BYTES_PER_ELEMENT));
  };
  const prim = json.meshes[0].primitives[0], at = prim.attributes;
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(read(at.POSITION), 3));
  geom.setAttribute('normal',   new THREE.BufferAttribute(read(at.NORMAL), 3));
  geom.setAttribute('uv',       new THREE.BufferAttribute(read(at.TEXCOORD_0), 2));
  geom.setIndex(new THREE.BufferAttribute(read(prim.indices), 1));
  // aFlex: 足元0 → 頭頂へ。箱と同じく 高さ/CHAR_H。
  const pos = geom.attributes.position.array, flex = new Float32Array(pos.length/3);
  for (let i = 0; i < flex.length; i++) flex[i] = clamp01(pos[i*3+1] / CHAR_H);
  geom.setAttribute('aFlex', new THREE.BufferAttribute(flex, 1));
  // 埋め込みテクスチャ
  const img = json.images[0], ibv = json.bufferViews[img.bufferView];
  const bytes = new Uint8Array(buf, binOff + (ibv.byteOffset||0), ibv.byteLength);
  const tex = new THREE.Texture(await createImageBitmap(new Blob([bytes], { type: img.mimeType })));
  tex.flipY = false;                              // glTF は UV 左上原点
  tex.needsUpdate = true;
  return { geometry: geom, texture: tex };
}

/* アイコンは駒種ぶん複数枚を描くので、WebGL コンテキストは1つだけ使い回す。
   都度 new すると（dispose してもコンテキストが残り）上限に触れて描画が空になる。 */
let iconRenderer = null;
function getIconRenderer(){
  if (!iconRenderer){
    iconRenderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
    iconRenderer.setPixelRatio(1); iconRenderer.setSize(128, 160, false); iconRenderer.setClearColor(0x000000, 0);
  }
  return iconRenderer;
}
/* 下部UIの自分の持ち駒アイコン。盤上と同じ形を一度だけ描いて PNG 化する。
   以後は静止画像なので対局中の負荷はない。 */
function makeSoldierIcon(geometry, matParams){
  const W = 128, H = 160, r = getIconRenderer();
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xbfd4e8, 0x2a2216, 0.7));
  const key = new THREE.DirectionalLight(0xfff1d6, 1.15); key.position.set(3, 5, 4); sc.add(key);
  const back = new THREE.DirectionalLight(0x8fa9d8, 0.4);  back.position.set(-4, 2, -3); sc.add(back);
  const mesh = new THREE.Mesh(geometry, new THREE.MeshLambertMaterial(matParams));
  mesh.rotation.y = Math.PI;                       // 盤上の自軍と同じ向き（奥を向く）
  sc.add(mesh);
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox, hh = bb.max.y - bb.min.y, cy = (bb.max.y + bb.min.y)/2;
  const cam = new THREE.PerspectiveCamera(30, W/H, 0.1, 10);
  cam.position.set(0, cy + hh*0.05, hh*3.05); cam.lookAt(0, cy - hh*0.04, 0);   // 正面やや上から全身
  r.render(sc, cam);
  const url = r.domElement.toDataURL('image/png');   // 直後に読むので描画は残る
  return url;
}

/* ═════════ 場面（idle-test を流用） ═════════ */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const SKY = new THREE.Color(0x76baf0);   // 舞台絵の空の上端付近の平均色。絵が読み込まれるまでの下地
scene.background = SKY;
const camera = new THREE.PerspectiveCamera(34, 1, 0.5, 60);
const TARGET = new THREE.Vector3(0, 0.0, 0.0);

// 弱めの地明かりに斜めの主光。陰影を残して駒の面を立てる。
scene.add(new THREE.HemisphereLight(0xbfd4e8, 0x2a2216, 0.5));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.1);
sun.position.set(7, 4.5, 3); scene.add(sun);
const rim = new THREE.DirectionalLight(0x8fa9d8, 0.4);   // 奥からの縁光で輪郭を盤から離す
rim.position.set(-5, 2.5, -6); scene.add(rim);

// 9×9 は地面に引いた細い線。絵の土より濃い茶にして、土の明るさに関わらず読めるようにする。
{
  const pts = [], half = N*SQ/2;
  for (let i = 0; i <= N; i++){ const p = -half + i*SQ;
    pts.push(-half,0,p, half,0,p); pts.push(p,0,-half, p,0,half); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const lines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    color: 0x3a2a18, transparent: true, opacity: 0.60 }));
  lines.position.y = 0.004; lines.renderOrder = 2; scene.add(lines);
}

/* 盤の目盛り。筋（1〜9）を手前の縁、段（一〜九）を右の縁に、マス線と同じ層で置く。
   文字は canvas に描いて板に貼る。後手のときは盤の反転に合わせて並びを反転する。 */
function scaleMark(text){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#3a2a18'; g.font = 'bold 50px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 32, 34);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.35*SQ, 0.35*SQ),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent:true, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.renderOrder = 2; scene.add(m); return m;
}
const fileMarks = Array.from({length:9}, (_, c) => scaleMark(String(9 - c)));   // 添字は col
const rankMarks = Array.from({length:9}, (_, r) => scaleMark(RANK_KANJI[r]));   // 添字は row
function placeScale(){
  const out = (N*SQ)/2 + 0.3*SQ;                    // 盤の縁から 0.3 マス外側
  fileMarks.forEach((m, c) => m.position.set(wx(flip ? 8-c : c), 0.004, out));
  rankMarks.forEach((m, r) => m.position.set(out, 0.004, wz(flip ? 8-r : r)));
}

/* 待機の揺れ（骨なし・頂点シェーダ。idle-test と同じ式） */
const uTime = { value: 0 }, uAmp = { value: 1 };
function wobbleMaterial(params){
  const m = new THREE.MeshLambertMaterial(params);
  m.onBeforeCompile = sh => {
    sh.uniforms.uTime = uTime; sh.uniforms.uAmp = uAmp;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        attribute float aPhase; attribute float aSpeed; attribute float aFlex;
        uniform float uTime; uniform float uAmp;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        {
          float t = uTime * aSpeed + aPhase;
          float f = aFlex * aFlex;
          transformed.y += sin(t*2.20) * 0.030 * uAmp;
          transformed.x += sin(t*1.70) * 0.055 * f * uAmp;
          transformed.z += sin(t*1.30+1.1) * 0.035 * f * uAmp;
        }`);
  };
  return m;
}

/* 陣営ごとに 1 つの InstancedMesh。盤上の駒と持ち駒を同じメッシュに詰める。
   片陣営が一度に持てるのは最大でも 39（相手玉が必ず盤に残る）。余裕を見て確保し、
   使わないスロットは縮尺0で隠す（capture-test と同じ隠し方）。 */
const MAXI = 44;
let PIECE_BASE = BASE;                         // 駒の基準倍率。モデル採用時は 1.0（全高0.70で作成済）
/* 兵の表示倍率。足元を原点に一様拡大するので、上へ伸びるだけで足元は動かない。
   実機で見比べて 1.30 に決めた（全高0.70相当→0.90相当）。 */
const SOL_SCALE = 1.3;
const jitterBySq = new Float32Array(81);
for (let i = 0; i < 81; i++) jitterBySq[i] = 0.97 + Math.random()*0.06;
const jitterHand = new Float32Array(MAXI);
for (let i = 0; i < MAXI; i++) jitterHand[i] = 0.97 + Math.random()*0.06;

function makeTeamMesh(geom, material){
  const g = geom.clone();
  const phase = new Float32Array(MAXI), speed = new Float32Array(MAXI);
  for (let k = 0; k < MAXI; k++){ phase[k] = Math.random()*Math.PI*2; speed[k] = 0.9 + Math.random()*0.25; }
  g.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phase, 1));
  g.setAttribute('aSpeed', new THREE.InstancedBufferAttribute(speed, 1));
  const mesh = new THREE.InstancedMesh(g, material, MAXI);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false; scene.add(mesh);
  return mesh;
}

/* ── 骨付きモデル（採用時の主経路）──────────────────────────────
   スキン＋待機アニメは自作パーサでは読めないため GLTFLoader を使う。
   駒種ごとに別モデル。個体は個別の SkinnedMesh（InstancedMesh は骨の姿勢を持てない）。
   1体を家族の最大数ぶん複製し、個体ごとに再生位置と速度をずらして同期を崩す。 */
/* 片陣営が一度に持てる各駒種の最大数（成り駒は元の駒に数える）。少し余裕を持たせる。 */
const POOL_CAP = { fu:20, kyo:4, kei:4, gin:4, kin:4, kaku:2, hisha:2, gyoku:2, uma:2, ryu:2 };
/* 成った姿を別モデルで出す駒と、その代用元。読み込めなければ元の駒の姿に落ちる。 */
const PROMOTED_OF = { uma: 'kaku', ryu: 'hisha' };
/* プール名の一覧。馬・龍は元の駒と別モデルなので BASE_NAME にそれらを足したもの。
   BASE_NAME 自体は scaleOf や持ち駒アイコンでも使うので、そちらは触らない。 */
const POOL_NAMES = [...BASE_NAME, 'uma', 'ryu'];
const poolNameOf = t => t === UM ? 'uma' : t === RY ? 'ryu' : BASE_NAME[baseOf(t)];
function loadGLTF(url){
  return new Promise((res, rej) => {
    if (!THREE.GLTFLoader) return rej(new Error('GLTFLoader 未読込'));
    new THREE.GLTFLoader().load(url, res, undefined, rej);
  });
}
/* 場面の光に合わせて材質を Lambert に置き換える。1つのモデルが複数のプリミティブを
   持つ場合はプリミティブごとに材質が違うので、テクスチャと色を1つずつ引き継ぐ
   （飛は本体がテクスチャ、銃身・木・金具は色のみの4マテリアル）。 */
function lambertFrom(src, skinning){
  const m = new THREE.MeshLambertMaterial({ skinning });
  if (src.map) m.map = src.map;
  if (src.color) m.color.copy(src.color);
  return m;
}
/* 複製した各メッシュは元と同じマテリアルを指すので、それを鍵に材質を1つずつ共有する。 */
function sharedLambert(skinning){
  const shared = new Map();
  return src => {
    let m = shared.get(src.uuid);
    if (!m){ m = lambertFrom(src, skinning); shared.set(src.uuid, m); }
    return m;
  };
}
/* gltf を size 体ぶん複製する。材質は元マテリアルごとに1つ作って全個体で共有する。
   骨（Object3D）とミキサー（駒種ごとの待機クリップ）だけ個体ごとに持つ。 */
function makePool(gltf, size){
  const clip = gltf.animations[0];
  const matFor = sharedLambert(true);
  const pool = []; pool.active = 0;
  for (let k = 0; k < size; k++){
    const root = THREE.SkeletonUtils.clone(gltf.scene);
    root.traverse(o => { if (o.isSkinnedMesh){ o.material = matFor(o.material); o.frustumCulled = false; } });
    root.visible = false; scene.add(root);
    const mixer = new THREE.AnimationMixer(root);
    const action = mixer.clipAction(clip); action.play();
    action.time = Math.random() * clip.duration;   // 個体ごとに再生位置をずらす
    mixer.timeScale = 0.9 + Math.random()*0.2;      // 速度も ±10% ばらつかせる
    pool.push({ root, mixer });
  }
  return pool;
}
/* 骨付き gltf から持ち駒アイコンを1枚作る（自軍＝青。盤上と同じ奥向きで撮る）。 */
function iconFromGltf(gltf){
  const clone = THREE.SkeletonUtils.clone(gltf.scene);
  clone.traverse(o => { if (o.isSkinnedMesh){ o.material = lambertFrom(o.material, true); o.frustumCulled = false; } });
  return `url("${makeSoldierIconFromObject(clone)}")`;
}
/* 骨付きモデルからも持ち駒アイコンを作る。1 体を安置ポーズのまま正面から撮る。 */
function makeSoldierIconFromObject(obj){
  const W = 128, H = 160, r = getIconRenderer();
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xbfd4e8, 0x2a2216, 0.7));
  const key = new THREE.DirectionalLight(0xfff1d6, 1.15); key.position.set(3, 5, 4); sc.add(key);
  const back = new THREE.DirectionalLight(0x8fa9d8, 0.4);  back.position.set(-4, 2, -3); sc.add(back);
  obj.rotation.y = Math.PI;                         // 盤上の自軍と同じ向き（奥を向く）
  // 骨付きは skin 変換で立つので、ノード変換込みの setFromObject では箱が潰れる（Armature が微小scale）。
  // 描画される大きさはジオメトリ本来のバウンディング（全高約0.70・足元原点）に一致するのでそれで構図を取る。
  // 複数プリミティブのモデルは全プリミティブを合わせないと構図から外れる部位が出る。
  let box = null;
  obj.traverse(o => {
    if (!o.isSkinnedMesh) return;
    o.frustumCulled = false;
    o.geometry.computeBoundingBox();
    box = box ? box.union(o.geometry.boundingBox) : o.geometry.boundingBox.clone();
  });
  sc.add(obj);
  if (!box) box = new THREE.Box3().setFromObject(obj);
  const hh = box.max.y - box.min.y, cy = (box.max.y + box.min.y)/2;
  const cam = new THREE.PerspectiveCamera(30, W/H, 0.1, 10);
  cam.position.set(0, cy + hh*0.05, hh*3.05); cam.lookAt(0, cy - hh*0.04, 0);
  r.render(sc, cam);
  const url = r.domElement.toDataURL('image/png');
  sc.remove(obj);
  return url;
}

/* 兵のモデルを読み込む。優先＝骨付き（待機アニメ入り）。失敗したら骨なし GLB、
   それも失敗したら箱の素体へ退避する。骨なし・箱は従来の InstancedMesh＋頂点揺れ。 */
let skinned = false;                  // 骨付きを採用できたか（描画経路の分岐）
let humanPools = {}, oppPools = {};   // 骨付き：駒種名→個体プール（陣営別）
let instHuman = null, instOpp = null; // 骨なし・箱：陣営ごとの InstancedMesh
const handIcons = {};                 // 骨付き：駒種名→持ち駒アイコン（自軍）
try {
  // 歩は全駒種の代用元。まず歩を読み、失敗したら骨なし／箱へ退避する。
  const [fuBlue, fuRed] = await Promise.all([
    loadGLTF('./assets/fu_blue_idle.glb'), loadGLTF('./assets/fu_red_idle.glb'),
  ]);
  const fuG = [fuBlue, fuRed];
  // 駒種ごとに assets/{種類}_{blue|red}_idle.glb を試し、無ければ歩で代用する。
  // 名前は駒種の内部名（BASE_NAME）そのまま。ファイルを足すだけで反映される。
  const resolve = async (name, team) => {
    if (name === 'fu') return fuG[team];
    const side = team === 0 ? 'blue' : 'red', from = PROMOTED_OF[name];
    // 成った姿は別ファイル。無ければ元の駒で代用し、それも無ければ歩まで落ちる。
    const url = from ? `./assets/${from}_${side}_promoted.glb`
                     : `./assets/${name}_${side}_idle.glb`;
    try { return await loadGLTF(url); }
    catch { return from ? resolve(from, team) : fuG[team]; }
  };
  const blueG = {};
  await Promise.all(POOL_NAMES.map(async name => {
    const [gb, gr] = await Promise.all([resolve(name, 0), resolve(name, 1)]);
    humanPools[name] = makePool(gb, POOL_CAP[name]);   // 手前・自軍
    oppPools[name]   = makePool(gr, POOL_CAP[name]);   // 奥・敵軍
    blueG[name] = gb;
  }));
  // 持ち駒欄のアイコンも駒種ごと（玉は持ち駒にならないので除く）。順に生成する。
  for (const name of BASE_NAME){ if (name !== 'gyoku') handIcons[name] = iconFromGltf(blueG[name]); }
  document.documentElement.style.setProperty('--sol-me', handIcons.fu);   // 未指定時の保険
  PIECE_BASE = 1.0;                   // モデルは全高 0.70 で作成済
  skinned = true;
} catch (eSkin) {
  console.warn('骨付きモデル読み込み失敗、骨なし／箱へ退避:', eSkin && eSkin.message);
  let hg, og, hm, om, iconGeom, iconParams;
  try {
    const [blue, red] = await Promise.all([
      loadGLB('./assets/fu_blue.glb'), loadGLB('./assets/fu_red.glb'),
    ]);
    hg = blue.geometry; og = red.geometry;
    hm = wobbleMaterial({ map: blue.texture }); om = wobbleMaterial({ map: red.texture });
    iconGeom = blue.geometry; iconParams = { map: blue.texture };
    PIECE_BASE = 1.0;
  } catch (err) {
    hg = og = bodyGeom;                          // 箱の素体（全高 CHAR_H）に退避
    hm = wobbleMaterial({ color: COLOR[0] }); om = wobbleMaterial({ color: COLOR[1] });
    iconGeom = bodyGeom; iconParams = { color: COLOR[0] };
    PIECE_BASE = BASE;
    console.warn('骨なし GLB も失敗、箱の素体へ退避:', err && err.message);
  }
  instHuman = makeTeamMesh(hg, hm);   // 手前・自軍
  instOpp   = makeTeamMesh(og, om);   // 奥・敵軍
  document.documentElement.style.setProperty('--sol-me', `url("${makeSoldierIcon(iconGeom, iconParams)}")`);
}

/* ── 金の動きをする駒の幟 ────────────────────────────────
   骨もアニメも無い静的メッシュ。盤上の該当駒に、駒とは別に1本立てる。
   両軍とも画面の同じ側・同じ向きに見せたいので、駒の回転（敵は180度）には追随させず、
   ワールド固定のずらし量と向きのまま置く。 */
/* 金と同じ動きになる駒。成り駒の姿は歩や銀のままなので、幟で見分けられるようにする。
   馬・龍は金と動きが違うので含めない。 */
const GOLD_MOVE = new Set([KI, TO, NY, NK, NG]);
const NOBORI_MAX = 20;                   // と金などを含むと片陣営でこの本数に達しうる
/* 下限0.337（成香の頭の半幅0.231＋竿の半幅0.0056＝0.2366 を 0.7026 で割った値）と
   上限0.54（兵×1.50で旗が隣のマスの駒に当たる手前）の中間。 */
const NOBORI_SIDE = 0.38 * 0.7026;       // 横へのずらし（駒の全高に対する比）
const NOBORI_BACK = 0.05 * 0.7026;       // 駒の背面側（自軍の背＝手前）へのずらし
const noboriPool = [[], []];             // 0=自軍 1=敵軍
try {
  const nobori = await Promise.all([
    loadGLTF('./assets/nobori_blue.glb'), loadGLTF('./assets/nobori_red.glb'),
  ]);
  nobori.forEach((g, team) => {
    const matFor = sharedLambert(false);
    for (let k = 0; k < NOBORI_MAX; k++){
      const root = g.scene.clone(true);
      // 旗は厚みのない一枚板で、裏を向いていると片面描画では消える。布は両面で見せる。
      root.traverse(o => { if (o.isMesh){ o.material = matFor(o.material); o.material.side = THREE.DoubleSide; } });
      root.visible = false; scene.add(root);
      noboriPool[team].push(root);
    }
  });
} catch (err) {
  console.warn('幟の読み込みに失敗、幟なしで続行:', err && err.message);
}

/* ── 龍の大砲 ────────────────────────────────────────────
   幟と同じ仕組み。陣営色を持たないので陣営で分けず1つのプールで足りる。
   長軸が前後を向いた状態で作ってあるので回転させない。 */
const TAIHO_MAX = 6;                     // 龍は片陣営2枚・両軍で4枚。余裕を見た数
const TAIHO_SIDE = 0.35 * 0.7026;        // 横へのずらし（駒の全高に対する比）
const taihoPool = [];
try {
  const g = await loadGLTF('./assets/taiho.glb');
  const matFor = sharedLambert(false);
  for (let k = 0; k < TAIHO_MAX; k++){
    const root = g.scene.clone(true);
    root.traverse(o => { if (o.isMesh) o.material = matFor(o.material); });
    root.visible = false; scene.add(root);
    taihoPool.push(root);
  }
} catch (err) {
  console.warn('大砲の読み込みに失敗、大砲なしで続行:', err && err.message);
}

const shadowTex = makeShadowTexture();
function makeShadowMesh(){
  const mesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: shadowTex, transparent:true, depthWrite:false }), MAXI);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false; mesh.renderOrder = 3; scene.add(mesh);
  return mesh;
}
const shadowHuman = makeShadowMesh();
const shadowOpp   = makeShadowMesh();

/* ═════════ 盤座標 ⇄ ワールド ═════════
   ルール層は sq=row*9+col。3D は file/rank（rank 大きいほど手前）。
   自分を常に手前に置くため、後手のときは前後左右を反転する。 */
let flip = false;
const wx = f => (f - (N-1)/2) * SQ;
const wz = r => (r - (N-1)/2) * SQ;
function sqToFR(sq){ const c = col(sq), r = row(sq);
  return flip ? { file: 8-c, rank: 8-r } : { file: c, rank: r }; }
function frToSq(file, rank){ const c = flip ? 8-file : file, r = flip ? 8-rank : rank;
  return r*9 + c; }
function worldOfSq(sq){ const fr = sqToFR(sq); return { x: wx(fr.file), z: wz(fr.rank) }; }

/* ═════════ ハイライト（合法手の表示） ═════════ */
const hlGroup = new THREE.Group(); scene.add(hlGroup);
/* 盤上の印は、色の層の下に濃茶の層を敷いた二層にする。絵の土は明るさが場所で変わるので、
   色だけでは沈む。濃茶の層は色の層の子にして、place() と visible の切り替えが親だけで
   両方に効くようにする。親は -90° 回してあるので、子の local z がそのまま世界の上下。 */
function mark(geom, color, opacity, y, order, baseGeom, baseOpacity){
  const m = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ color, transparent:true, opacity, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.userData.y = y; m.visible = false; m.renderOrder = order;
  const b = new THREE.Mesh(baseGeom,
    new THREE.MeshBasicMaterial({ color: 0x2a1c10, transparent:true, opacity: baseOpacity, depthWrite:false }));
  b.position.z = -0.002; b.renderOrder = order - 1; m.add(b);
  hlGroup.add(m); return m;
}
function tile(color, opacity, size, y){
  const g = new THREE.PlaneGeometry(size, size);
  return mark(g, color, opacity, y, 4, g, 0.55);
}
const selTile   = tile(0xc9a227, 0.44, 0.92, 0.012);
const checkTile = tile(0xe0653f, 0.50, 0.92, 0.012);
const lastTiles = [tile(0xffffff, 0.34, 0.92, 0.011), tile(0xffffff, 0.34, 0.92, 0.011)];  // 色は指した側の陣営色に差し替える
const toTile    = tile(0x6fd8c8, 0.50, 0.92, 0.012);   // 成り確認中の移動先。選択中の黄と区別する
const discGeom  = new THREE.CircleGeometry(0.12, 20), discBase = new THREE.CircleGeometry(0.19, 20);
const ringGeom  = new THREE.RingGeometry(0.31, 0.43, 22), ringBase = new THREE.RingGeometry(0.27, 0.47, 22);
const discPool  = Array.from({length:81}, () => mark(discGeom, 0xc9a227, 0.95, 0.014, 5, discBase, 0.80));
const ringPool  = Array.from({length:40}, () => mark(ringGeom, 0xd8402a, 0.95, 0.014, 5, ringBase, 0.80));
function place(mesh, sq){ const w = worldOfSq(sq); mesh.position.set(w.x, mesh.userData.y, w.z); }

function layoutHighlights(){
  discPool.forEach(m => m.visible=false); ringPool.forEach(m => m.visible=false);
  lastTiles.forEach(m => m.visible=false); selTile.visible=false; checkTile.visible=false;
  toTile.visible = false;
  if (lastMove){
    // 直前の手は「指した側の陣営色」。選択中・合法手の黄色と区別して「起きたこと」を示す。
    const c = teamOf(lastMove.color) === 0 ? COLOR[0] : COLOR[1];
    lastTiles.forEach(m => m.material.color.setHex(c));
    if (lastMove.from >= 0){ place(lastTiles[0], lastMove.from); lastTiles[0].visible=true; }
    place(lastTiles[1], lastMove.to); lastTiles[1].visible=true;
  }
  if (pos.kingSq[pos.turn] >= 0 && inCheck(pos)){ place(checkTile, pos.kingSq[pos.turn]); checkTile.visible=true; }
  const busy = over || thinking || anim;
  if (pendingPromo){
    // 移動元から伸びる合法手はもう選び終わった情報なので出さない。
    const mv = pendingPromo[0];
    place(selTile, moveFrom(mv)); selTile.visible = true;
    place(toTile, moveTo(mv));    toTile.visible = true;
    // 押した側だけを、その側の色で出す。未選択のあいだは行ける先を出さない。
    if (promoPick){
      const reach = promoPick === 'yes' ? promoReach : promoReachNo;
      const color = promoPick === 'yes' ? 0xb07bd8 : 0xf0ece0;
      let di = 0, ri = 0;
      for (const [sq, occupied] of reach){
        const m = occupied ? ringPool[ri++] : discPool[di++];
        if (m){ place(m, sq); m.material.color.setHex(color); m.visible = true; }
      }
    }
  } else if (!busy && pos.turn === humanColor && selected){
    if (selected.kind === 'board'){ place(selTile, selected.sq); selTile.visible=true; }
    let di = 0, ri = 0;
    for (const sq of targets.keys()){
      // 成り確認で塗った紫が残らないよう、こちらでも色を毎回指定する。
      if (pos.board[sq] !== EMPTY){ const m = ringPool[ri++]; if (m){ place(m, sq); m.material.color.setHex(0xd8402a); m.visible=true; } }
      else { const m = discPool[di++]; if (m){ place(m, sq); m.material.color.setHex(0xc9a227); m.visible=true; } }
    }
  }
}

/* ═════════ 駒の配置（毎フレーム pos から作る。移動中の駒だけ上書き） ═════════ */
const dummy = new THREE.Object3D();
const shadowDummy = new THREE.Object3D();

/* 骨付き：各個体を駒種名のプールへ振り分けて姿勢を置く。余りは不可視にして描画から外す。
   成り駒は元の駒のプール（＝元の駒のモデル）に入る。馬だけ専用モデルなので別プール。 */
function applyTeamSkinned(pools, list){
  const idx = {};
  for (const name of POOL_NAMES) idx[name] = 0;
  for (const e of list){
    const name = poolNameOf(e.type);
    const pool = pools[name], k = idx[name]++;
    if (k >= pool.length) continue;                 // 想定外の超過は描かない（POOL_CAP で防ぐ）
    const m = pool[k], base = PIECE_BASE * SOL_SCALE * scaleOf(e.type) * e.jitter;
    m.root.position.set(e.x, e.y, e.z);
    m.root.rotation.set(e.rx, e.ry, e.rz);
    m.root.scale.set(base*e.mx, base*e.my, base*e.mz);
    m.root.visible = true;
  }
  for (const name of POOL_NAMES){
    const pool = pools[name];
    for (let k = idx[name]; k < pool.length; k++) pool[k].root.visible = false;
    pool.active = idx[name];
  }
}
/* 骨なし・箱：陣営を 1 つの InstancedMesh に詰める（従来どおり）。 */
function writeTeamInstanced(mesh, list){
  for (let k = 0; k < MAXI; k++){
    if (k < list.length){
      const e = list[k], base = PIECE_BASE * SOL_SCALE * scaleOf(e.type) * e.jitter;
      dummy.position.set(e.x, e.y, e.z);
      dummy.rotation.set(e.rx, e.ry, e.rz);
      dummy.scale.set(base*e.mx, base*e.my, base*e.mz);
      dummy.updateMatrix(); mesh.setMatrixAt(k, dummy.matrix);
    } else {
      dummy.position.set(0,-99,0); dummy.rotation.set(0,0,0); dummy.scale.setScalar(0);
      dummy.updateMatrix(); mesh.setMatrixAt(k, dummy.matrix);
    }
  }
  mesh.instanceMatrix.needsUpdate = true;
}
/* 幟を該当駒のいるマスへ置く。向きは触らない（ワールド固定＝画面基準で両軍そろう）。
   駒の大きさ倍率はずらし量にも掛け、駒との位置関係を倍率によらず保つ。 */
function writeBanners(list){
  const base = PIECE_BASE * SOL_SCALE;
  const idx = [0, 0];
  for (const b of list){
    const pool = noboriPool[b.team], k = idx[b.team]++;
    if (k >= pool.length){ console.warn(`幟が上限 ${pool.length} を超えたので出しません`); continue; }
    const o = pool[k];
    o.position.set(b.x + NOBORI_SIDE*base, 0, b.z + NOBORI_BACK*base);
    o.scale.setScalar(base);
    o.visible = true;
  }
  for (let t = 0; t < 2; t++){
    const pool = noboriPool[t];
    for (let k = idx[t]; k < pool.length; k++) pool[k].visible = false;
  }
}
/* 大砲を龍のいるマスへ置く。幟と同じくワールド固定で、駒の回転には追随させない。 */
function writeCannons(list){
  const base = PIECE_BASE * SOL_SCALE;
  let n = 0;
  for (const c of list){
    const k = n++;
    if (k >= taihoPool.length){ console.warn(`大砲が上限 ${taihoPool.length} を超えたので出しません`); continue; }
    const o = taihoPool[k];
    o.position.set(c.x + TAIHO_SIDE*base, 0, c.z);
    o.scale.setScalar(base);
    o.visible = true;
  }
  for (let k = n; k < taihoPool.length; k++) taihoPool[k].visible = false;
}
/* 足元の影は骨付き・骨なしとも同じ InstancedMesh。跳ねるほど縮めて接地感を残す。 */
function writeShadows(shadowMesh, list){
  for (let k = 0; k < MAXI; k++){
    if (k < list.length){
      const e = list[k], base = PIECE_BASE * SOL_SCALE * scaleOf(e.type) * e.jitter;
      const grip = 1 - clamp01(e.y * 1.4) * 0.7;
      shadowDummy.position.set(e.x, 0.006, e.z);
      shadowDummy.rotation.set(-Math.PI/2, 0, 0);
      shadowDummy.scale.set(base*e.mx*0.66*grip, base*e.mz*0.44*grip, 1);
      shadowDummy.updateMatrix(); shadowMesh.setMatrixAt(k, shadowDummy.matrix);
    } else {
      shadowDummy.position.set(0,-99,0); shadowDummy.scale.setScalar(0);
      shadowDummy.updateMatrix(); shadowMesh.setMatrixAt(k, shadowDummy.matrix);
    }
  }
  shadowMesh.instanceMatrix.needsUpdate = true;
}
const teamOf = color => color === humanColor ? 0 : 1;   // 0=手前 1=奥
const ryOf   = color => teamOf(color) === 1 ? 0 : Math.PI;   // 両軍を向き合わせる（敵=奥から手前、自=手前から奥）

function moverEntry(){
  const a = anim, w1 = worldOfSq(a.to), w0 = a.from >= 0 ? worldOfSq(a.from) : null;
  const type = typeOf(pos.board[a.to]);                 // 成った後の姿を含む
  const u = Math.min(a.t, 1);
  let x = w1.x, z = w1.z, y = 0, rx = 0, mx = 1, my = 1, mz = 1;
  if (a.kind === 'drop'){
    const s = 0.6 + 0.4*outBack(u); mx = my = mz = s; y = (1 - outCubic(u)) * 0.25;
  } else if (a.kind === 'capture'){
    let k;
    if (u < 0.40) k = outCubic(seg(u,0,0.40)) * 0.70;
    else if (u < 0.50) k = 0.70 + inCubic(seg(u,0.40,0.50)) * 0.42;   // 少し踏み込む
    else k = 1.12 - outBack(seg(u,0.50,0.62)) * 0.12;                 // 戻る
    const hop  = u < 0.40 ? Math.sin(seg(u,0,0.40)*Math.PI)*0.20 : 0;
    const lean = (u>=0.40 && u<0.62) ? Math.sin(seg(u,0.40,0.62)*Math.PI)*0.30 : 0;
    x = w0.x + (w1.x-w0.x)*k; z = w0.z + (w1.z-w0.z)*k; y = hop; rx = -lean;
  } else {                                              // 通常の移動（弧を描いて滑る）
    const k = outCubic(u);
    x = w0.x + (w1.x-w0.x)*k; z = w0.z + (w1.z-w0.z)*k; y = Math.sin(u*Math.PI)*0.20;
  }
  return { x, y, z, rx, ry: ryOf(a.moverColor), rz:0, type, jitter: jitterBySq[a.to], mx, my, mz };
}
/* 撃破側：capture-test の「つぶれて消える」（style 0） */
function victimEntry(){
  const a = anim, w1 = worldOfSq(a.to), u = Math.min(a.t, 1);
  let rx = 0, mx = 1, my = 1, mz = 1;
  if (u < 0.50){ rx = u > 0.36 ? Math.sin(seg(u,0.36,0.50)*Math.PI)*0.10 : 0; }
  else {
    const d = seg(u,0.50,0.78), sq = outCubic(d);
    my = 1 - sq*0.95; mx = mz = 1 + Math.sin(d*Math.PI)*0.55 - sq*0.55;
    if (d >= 1){ mx = my = mz = 0; }
  }
  return { x: w1.x, y:0, z: w1.z, rx, ry: ryOf(a.capColor), rz:0,
           type: a.capType, jitter: jitterBySq[a.to], mx, my, mz };
}

/* 敵の持ち駒を盤の奥の地面に立たせる（自分の持ち駒は下部パネルだけ）。マス目は作らず、
   種類ごとにまとめて横に並べ、あふれたら盤から離れる向きへ列を足す。 */
function addHandEntries(list, color){
  const hand = pos.hands[color];
  let total = 0; for (const t of HAND_ORDER) total += hand[t];
  if (!total) return;
  const perRow = 10, dx = 0.8, dz = 0.85;
  const z0 = -((N*SQ)/2 + 0.8);
  let i = 0;
  for (const t of HAND_ORDER){
    for (let c = 0; c < hand[t]; c++, i++){
      const rowN = Math.floor(i / perRow), colN = i - rowN*perRow;
      const inRow = Math.min(perRow, total - rowN*perRow);
      list.push({ x: (colN - (inRow-1)/2) * dx, y: 0, z: z0 - rowN*dz,
        rx:0, ry:0, rz:0, type: t, jitter: jitterHand[i % MAXI], mx:1, my:1, mz:1 });   // 盤上の敵と同じ手前向き
    }
  }
}

function layout(){
  const human = [], opp = [], banners = [], cannons = [];
  const listFor = c => teamOf(c) === 0 ? human : opp;
  for (let sq = 0; sq < 81; sq++){
    const p = pos.board[sq]; if (p === EMPTY) continue;
    if (anim && sq === anim.to){
      const e = moverEntry(); listFor(anim.moverColor).push(e);
      if (GOLD_MOVE.has(e.type)) banners.push({ x:e.x, z:e.z, team: teamOf(anim.moverColor) });
      if (e.type === RY) cannons.push({ x:e.x, z:e.z });
      continue;
    }
    const w = worldOfSq(sq);
    listFor(colorOf(p)).push({ x:w.x, y:0, z:w.z, rx:0, ry:ryOf(colorOf(p)), rz:0,
      type: typeOf(p), jitter: jitterBySq[sq], mx:1, my:1, mz:1 });
    if (GOLD_MOVE.has(typeOf(p))) banners.push({ x:w.x, z:w.z, team: teamOf(colorOf(p)) });
    if (typeOf(p) === RY) cannons.push({ x:w.x, z:w.z });
  }
  // 取られた駒は盤から消えているので幟も出ない（つぶれる演出には参加しない）。
  if (anim && anim.cap) listFor(anim.capColor).push(victimEntry());
  addHandEntries(opp, 1 - humanColor);              // 敵の持ち駒＝奥の地面
  if (skinned){
    applyTeamSkinned(humanPools, human);
    applyTeamSkinned(oppPools,   opp);
  } else {
    writeTeamInstanced(instHuman, human);
    writeTeamInstanced(instOpp,   opp);
  }
  writeShadows(shadowHuman, human);
  writeShadows(shadowOpp,   opp);
  writeBanners(banners);
  writeCannons(cannons);
}

/* ═════════ 拡大・視点移動（俯角35度・回転なしのまま、投影行列だけで拡大／移動）═════════
   カメラの位置と向きは動かさず、投影行列を等倍(zoom=1)から最大3倍まで拡大し、
   pan で切り取り位置をずらす「デジタルズーム」。レイキャストは同じ逆行列を使うので、
   拡大・移動してもタップは正しいマスに当たる（俯角も向きも一切変わらない）。 */
let zoom = 1, panX = 0, panY = 0;             // pan は NDC 単位のずらし量
let baseE0 = 1, baseE5 = 1;                    // 等倍時の投影スケール（resize で確定）
let lensX = 0;                                 // 横のレンズシフト（NDC。resize で確定。負＝左寄せ）
function applyView(){
  const e = camera.projectionMatrix.elements;
  e[0] = baseE0 * zoom;                        // 横スケール
  e[5] = baseE5 * zoom;                        // 縦スケール
  e[8] = -lensX * zoom - panX;                 // レンズシフト（左寄せ）＋横のずらし
  e[9] = LENS * zoom - panY;                   // レンズシフト（下寄せ）＋縦のずらし
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  $('reset').hidden = zoom <= 1;               // zoom の変更は全てここを通るので、解除ボタンの表示もここで
}
/* pan を等倍で見えていた範囲の内側に制限する。等倍のNDC[-1,1]は盤・持ち駒・空を
   ちょうど収めた画（レンズシフト込み）。ndc'=zoom·ndc0+pan の ndc0 を [-1,1] に収める
   条件が |pan|≤zoom-1。これで拡大しても等倍の画の外（盤から離れた地面）へは出ない。 */
function clampView(){
  zoom = clamp(zoom, 1, 3);
  if (zoom <= 1){ zoom = 1; panX = 0; panY = 0; return; }
  const lim = zoom - 1;
  panX = clamp(panX, -lim, lim);
  panY = clamp(panY, -lim, lim);
}

/* 舞台絵。カメラに正対させた板に絵を丸ごと貼り、いちばん奥の物体より遠くに置く。
   scene.background でなく Mesh にするのは、zoom/pan が投影行列なので盤と一緒に動くため。 */
const STAGE_BASE = 0.64;     // 絵の上端から陣幕の底（地面との境目）までの割合。絵から測った実測値
const STAGE_BEYOND = 8;      // 視線に沿って TARGET の奥へ置く距離。いちばん奥の物体（敵の
                             // 持ち駒の最奥 z≈-7.3、高さ 0.7）は TARGET の奥 5.6 なので、その先
let stage = null;
new THREE.TextureLoader().load('./assets/stage/honjin.jpg', tex => {
  stage = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: tex, fog: false }));   // 照明を受けない。絵の色そのまま
  stage.renderOrder = -1; scene.add(stage);                   // 最背面
  fitStage();
});
/* 陣幕の底を、等倍で盤の奥端から2マス奥（z=-6.5, y=0）が映る画面の高さに合わせ、画面の
   上下左右すべてを絵が覆う最小の倍率にする（cover）。はみ出した分は画面の外に出るだけ。
   板はカメラから D の奥行きに正対しているので、等倍の投影はカメラ座標 (x,y) に対して
   ndc.x = baseE0·x/D + lensX、ndc.y = baseE5·y/D − LENS。 */
function fitStage(){
  if (!stage) return;                                          // 絵の読み込み前の resize
  camera.updateMatrixWorld();
  const q = camera.quaternion, C = camera.position;
  const D = C.distanceTo(TARGET) + STAGE_BEYOND;
  const pc = new THREE.Vector3(0, 0, -(N*SQ)/2 - 2*SQ).applyMatrix4(camera.matrixWorldInverse);
  const yLine = pc.y * D / -pc.z;                              // 陣幕の底の高さ（板の上、カメラ座標）
  const yTop = (1 + LENS) * D / baseE5, yBot = (LENS - 1) * D / baseE5;   // 画面の上端・下端
  const img = stage.material.map.image, a = img.width / img.height;
  const H = Math.max((yTop - yLine) / STAGE_BASE, (yLine - yBot) / (1 - STAGE_BASE),
                     2 * D / (baseE0 * a));
  stage.scale.set(H * a, H, 1);
  stage.position.set(-lensX * D / baseE0, yLine + H * (STAGE_BASE - 0.5), -D)   // 横は画面の中央（シフト分ずらす）
    .applyQuaternion(q).add(C);
  stage.quaternion.copy(q);
}

/* ═════════ 画面合わせ（idle-test を流用） ═════════ */
function resize(){
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const FIT = 0.94, EDGE_PX = 2;                    // 盤の手前の辺を画面幅の 94% に、左余白 2px で置く。残りの右余白に段の目盛りが入る
  const halfW = (N*SQ)/2 / FIT;
  lensX = 2*EDGE_PX / w - (1 - FIT);               // 左端の余白 (1−FIT)/2 を 2px ぶんまで詰める
  const vFov = camera.fov * Math.PI/180;
  const hFov = 2 * Math.atan(Math.tan(vFov/2) * camera.aspect);
  // 盤は手前へ傾くので、いちばん近い手前端の筋がいちばん広く映る。その手前端の
  // 奥行き(dist − 手前へのはみ出し)で横幅を合わせないと両端の筋が画面外に切れる。
  const distW = halfW / Math.tan(hFov/2) + (N*SQ)/2 * Math.cos(TILT);
  // 縦は「手前端が画面下に収まる」条件。手前端の y/depth = (N/2)sinθ/(dist−(N/2)cosθ)。
  const distD = ((N*SQ)/2 + 0.3) * Math.sin(TILT) / Math.tan(vFov/2) + (N*SQ)/2 * Math.cos(TILT);
  const dist = Math.max(distW, distD);
  camera.position.set(TARGET.x, TARGET.y + dist*Math.sin(TILT), TARGET.z + dist*Math.cos(TILT));
  camera.lookAt(TARGET); camera.updateProjectionMatrix();
  baseE0 = camera.projectionMatrix.elements[0];     // 等倍の投影スケールを控える
  baseE5 = camera.projectionMatrix.elements[5];
  clampView(); applyView();                          // 拡大中の resize でも破綻しない
  fitStage();
}
addEventListener('resize', () => { resize(); });

/* ═════════ 対局の状態（play.html と同じ枠組み） ═════════ */
const $ = id => document.getElementById(id);
const turnEl = $('turn'), infoEl = $('info');
const npc = new Npc();
let fallbackRun = 0;                     // NPC の退避手が何手続いているか
let pos, humanColor, level;
let legal = [], selected = null, targets = new Map();
let lastMove = null, thinking = false, over = false, pendingPromo = null, promoReach = null, promoReachNo = null;
let promoPick = null;                    // 'yes' | 'no' | null（未選択）
let logLines = [];                       // 戦闘ログ（表現層。直近2行を下部に、全部をシートに）
let repKeys = [], repChecks = [];        // 千日手の照合用。開始局面から毎手の局面キーと王手の有無
let anim = null;                         // {from,to,moverColor,cap,capColor,capType,kind,t,dur,resolve}
let sceneDirty = true, hlDirty = true;

/* ─ 選択と合法手の表示 ─ */
function clearSelection(){ selected = null; targets = new Map(); }
function collectTargets(pred){
  targets = new Map();
  for (const mv of legal){
    if (!pred(mv)) continue;
    const to = moveTo(mv);
    (targets.get(to) || targets.set(to, []).get(to)).push(mv);
  }
}
function selectBoard(sq){
  const p = pos.board[sq];
  if (p === EMPTY || colorOf(p) !== humanColor) return;
  selected = { kind:'board', sq };
  collectTargets(mv => !isDrop(mv) && moveFrom(mv) === sq);
  hlDirty = true; renderStatus();
}
function selectHand(pt){
  if (!pos.hands[humanColor][pt]) return;
  selected = { kind:'hand', pt };
  collectTargets(mv => isDrop(mv) && dropType(mv) === pt);
  hlDirty = true; renderStatus();
}
/* その手を指した後、動かした駒が次に行ける先（表示用。ルール層は変えない）。
   着手を適用した局面で手番を指した側へ戻し、移動先から動く手だけを集める。 */
function afterMove(mv){
  const p = clone(pos), to = moveTo(mv), mover = pos.turn;
  doMove(p, mv);
  p.turn = mover;
  const foeKing = p.kingSq[1 - mover];   // 玉を取る手は対局に現れない。偽の行き先になるので除く
  const reach = new Map();
  for (const m of legalMoves(p)){
    if (isDrop(m) || moveFrom(m) !== to || moveTo(m) === foeKing) continue;
    reach.set(moveTo(m), p.board[moveTo(m)] !== EMPTY);   // 成り違いで同じ先が2回来るのでMapで畳む
  }
  return { reach };
}
/* 成り確認を閉じ、選択状態と決定ボタンを初期に戻す。開くときも一度ここを通す。 */
function closePromo(){
  pendingPromo = null; promoPick = null;
  $('promoOv').classList.remove('on');
  $('promoYes').classList.remove('pick'); $('promoNo').classList.remove('pick');
  $('promoGo').disabled = true;
  hlDirty = true;
}
function chooseTarget(to){
  const cand = targets.get(to);
  if (!cand || !cand.length) return;
  if (cand.length === 1){ humanPlay(cand[0]); return; }
  closePromo();                                            // 前回の選択状態を残さない
  pendingPromo = cand;                                     // 成り／不成の確認
  const yes = afterMove(cand.find(m => movePro(m))), no = afterMove(cand.find(m => !movePro(m)));
  promoReach = yes.reach; promoReachNo = no.reach;         // どちらも「その場合に行ける先の全部」
  $('promoYes').textContent = `進化する／行ける先 ${yes.reach.size}か所`;
  $('promoNo').textContent  = `進化しない／行ける先 ${no.reach.size}か所`;
  $('promoOv').classList.add('on');
  hlDirty = true;
}

/* ─ 着手（ルール層で確定 → 3D で再生） ─ */
function commitMove(mv){
  const from = isDrop(mv) ? -1 : moveFrom(mv);
  const to = moveTo(mv), moverColor = pos.turn;
  const cap = !isDrop(mv) && pos.board[to] !== EMPTY;
  const capColor = cap ? colorOf(pos.board[to]) : -1;
  const capType  = cap ? typeOf(pos.board[to]) : -1;
  let line = logLine(pos, mv);            // 着手前の局面から文を作る
  doMove(pos, mv);
  if (inCheck(pos)) line += '。大将に迫る';
  logLines.push(line);
  repKeys.push(positionKey(pos)); repChecks.push(inCheck(pos));
  npc.moved(toSfen(pos));
  lastMove = { from, to, color: moverColor };
  renderHands(); renderLog();
  const kind = isDrop(mv) ? 'drop' : (cap ? 'capture' : 'move');
  const dur = kind === 'drop' ? 0.28 : (kind === 'capture' ? 0.80 : 0.32);
  return new Promise(res => {
    anim = { from, to, moverColor, cap, capColor, capType, kind, t:0, dur, resolve:res };
    sceneDirty = true; hlDirty = true;
  });
}
async function humanPlay(mv){
  clearSelection(); hlDirty = true;
  await commitMove(mv);
  if (checkTerminalAfterMove('あなた')) return;
  scheduleNpc();
}

/* ─ NPC（play.html と同じ。npc.js 経由で Worker） ─ */
async function scheduleNpc(){
  thinking = true; legal = []; hlDirty = true; renderStatus();
  const sfen = toSfen(pos);
  let res; try { res = await npc.think(sfen, level); } catch { res = null; }
  thinking = false;
  if (over || toSfen(pos) !== sfen) return;              // 投了・新規対局で局面が変わっていたら破棄

  let usi = res && res.usi;
  const legalNow = legalMoves(pos);
  const legalUsi = new Set(legalNow.map(moveToUsi));
  let fallback;
  if (usi && legalUsi.has(usi)){
    fallback = !!res.fallback;
    console.log(`NPC: ${usi} worker d${res.depth ?? '?'} ${res.ms ?? '?'}ms${fallback ? ' 退避手' : ''}`);
  } else {
    if (legalNow.length === 0){ over = true; showResult('あなたの勝ち', 'NPC は指す手がありません'); return; }
    usi = moveToUsi(legalNow[Math.floor(Math.random()*legalNow.length)]); fallback = true;
    console.log(`NPC: ${usi} 退避手（worker が指し手を返せなかった）`);
  }
  await commitMove(usiToMove(usi));
  // 退避手が2手続いたら worker が答えられていないと見て知らせる。1手なら出さない。
  fallbackRun = fallback ? fallbackRun + 1 : 0;
  infoEl.textContent = fallbackRun >= 2 ? '対戦相手の調子が悪いようです。新規対局をお試しください' : '';
  if (checkTerminalAfterMove('NPC')) return;
  legal = legalMoves(pos); hlDirty = true; renderStatus();
}

/* ─ 決着（合法手が無ければ手番側の負け。判定はルール層のみ） ─ */
function checkTerminalAfterMove(mover){
  if (legalMoves(pos).length === 0){
    over = true; hlDirty = true;
    const how = inCheck(pos) ? '詰み' : '手詰まり';
    showResult(mover === 'あなた' ? 'あなたの勝ち' : 'あなたの負け', `${mover}の勝ち（${how}）`);
    return true;
  }
  const rep = repetition(repKeys, repChecks);
  if (rep !== null){
    over = true; hlDirty = true;
    if (rep === 'draw') showResult('引き分け', '同じ局面が4回くり返されたため（千日手）');
    else showResult(rep === humanColor ? 'あなたの負け' : 'あなたの勝ち',
                    `${rep === humanColor ? 'NPC' : 'あなた'}の勝ち。同じ局面のくり返し（千日手・連続王手）`);
    return true;
  }
  renderStatus(); return false;
}

/* ═════════ 画面表示 ═════════ */
function renderStatus(){
  if (over) return;
  const checkSide = inCheck(pos) ? pos.turn : -1;
  let t = thinking ? '敵軍の行動…' : (anim ? '…' : (pos.turn === humanColor ? '自軍の行動' : '敵軍の行動'));
  if (!thinking && !anim && pos.turn === humanColor && selected){
    t += `・${logName(selected.kind === 'board' ? typeOf(pos.board[selected.sq]) : selected.pt)}`;
  }
  if (checkSide >= 0 && !anim) t += '（王手）';
  // 王手中に、動かせる手のない駒を選んだら、その駒では受けられないことを知らせる
  if (checkSide === humanColor && selected && targets.size === 0 && !anim) t = 'この駒では大将を守れません';
  turnEl.textContent = t;
  turnEl.classList.toggle('check', checkSide >= 0 && !anim);
}
/* 下部UIは自分の持ち駒だけ（打つための操作面）。敵の持ち駒は 3D 空間に出す。 */
function renderHands(){
  const el = $('handBottom'); el.innerHTML = '';
  let any = false;
  for (const t of HAND_ORDER){
    const n = pos.hands[humanColor][t]; if (!n) continue; any = true;
    const e = document.createElement('div'); e.className = 'koma'; e.dataset.pt = t;
    const ic = handIcons[BASE_NAME[t]]; if (ic) e.style.backgroundImage = ic;   // 駒種ごとのモデル
    const k = document.createElement('span'); k.className = 'k'; k.textContent = KANJI[t]; e.appendChild(k);
    if (selected && selected.kind==='hand' && selected.pt===t) e.classList.add('sel');
    if (n > 1){ const b = document.createElement('span'); b.className='n'; b.textContent=n; e.appendChild(b); }
    el.appendChild(e);
  }
  if (!any){ const s = document.createElement('span'); s.className='empty'; s.textContent='なし'; el.appendChild(s); }
}
function showResult(big, sub){
  $('resultBig').textContent = big; $('resultSub').textContent = sub;
  $('resultOv').classList.add('on');
  turnEl.textContent = big; turnEl.classList.remove('check');
}
/* 直近5行を下部の枠へ（最新が下、最下段だけ --ink）。全履歴は枠を押したときのシートに出す。 */
function renderLog(){
  const rows = $('log').children, n = logLines.length;
  for (let i = 0; i < rows.length; i++){
    const k = n - rows.length + i;                    // 行が足りないあいだは上から空ける
    rows[i].textContent = k >= 0 ? logLines[k] : '';
  }
}
$('log').addEventListener('click', () => {
  const list = $('logList'); list.innerHTML = '';
  for (const s of logLines){ const d = document.createElement('div'); d.textContent = s; list.appendChild(d); }
  $('logOv').classList.add('on');
  list.scrollTop = list.scrollHeight;                   // 開いたとき最新行が見える位置に
});
$('logClose').addEventListener('click', () => $('logOv').classList.remove('on'));

/* ═════════ 入力 ═════════ */
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const hitPt = new THREE.Vector3();
/* 指が動かなかったタップだけを駒の選択に使う。拡大・移動しても投影の逆行列を
   使うので、レイは正しいマスへ当たる。 */
function handleTap(clientX, clientY){
  if (over || thinking || anim || pos.turn !== humanColor) return;
  const rect = canvas.getBoundingClientRect();
  const nx = ((clientX-rect.left)/rect.width)*2 - 1;
  const ny = -((clientY-rect.top)/rect.height)*2 + 1;
  raycaster.setFromCamera({x:nx, y:ny}, camera);
  if (!raycaster.ray.intersectPlane(groundPlane, hitPt)) return;
  const file = Math.round(hitPt.x/SQ + (N-1)/2);
  const rank = Math.round(hitPt.z/SQ + (N-1)/2);
  if (file < 0 || file > 8 || rank < 0 || rank > 8) return;
  const sq = frToSq(file, rank);
  if (targets.has(sq)){ chooseTarget(sq); return; }
  const p = pos.board[sq];
  if (p !== EMPTY && colorOf(p) === humanColor){ selectBoard(sq); return; }
  clearSelection(); hlDirty = true; renderStatus();
}

/* ピンチで拡大縮小、1本指ドラッグで視点移動（拡大時のみ）、動かなければタップ。 */
const pointers = new Map();          // pointerId → {x,y}
let gesture = 'idle';                // 'tap' | 'drag' | 'pinch' | 'idle'
let moved = false, tapStart = null, dragLast = null, pinchStart = null;
const TAP_SLOP = 10;                 // これ以上動いたらドラッグ扱い（CSS px）
function ndcOf(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return { x: ((clientX-r.left)/r.width)*2 - 1, y: -((clientY-r.top)/r.height)*2 + 1 };
}
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size >= 2){
    const [a,b] = [...pointers.values()];
    const mid = ndcOf((a.x+b.x)/2, (a.y+b.y)/2);
    pinchStart = { dist: Math.hypot(a.x-b.x, a.y-b.y), zoom, mid, panX, panY };
    gesture = 'pinch'; moved = true;
  } else {
    tapStart = { x:e.clientX, y:e.clientY }; gesture = 'tap'; moved = false;
  }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (gesture === 'pinch' && pointers.size >= 2){
    const [a,b] = [...pointers.values()];
    const zo = pinchStart.zoom;
    const zn = clamp(zo * (Math.hypot(a.x-b.x, a.y-b.y) / pinchStart.dist), 1, 3);
    const mid = pinchStart.mid;                       // ピンチ中心の盤点を保つ
    panX = pinchStart.panX + (1 - zn/zo) * (mid.x - pinchStart.panX);
    panY = pinchStart.panY + (1 - zn/zo) * (mid.y - pinchStart.panY);
    zoom = zn; clampView(); applyView();
  } else if (pointers.size === 1 && (gesture === 'tap' || gesture === 'drag')){
    if (!moved && Math.hypot(e.clientX-tapStart.x, e.clientY-tapStart.y) > TAP_SLOP){
      moved = true;                                   // 指が動いた＝タップではない
      if (zoom > 1){ gesture = 'drag'; dragLast = { x:e.clientX, y:e.clientY }; }
    }
    if (gesture === 'drag'){                           // 拡大時のみ視点移動（指に追従）
      const r = canvas.getBoundingClientRect();
      panX += ((e.clientX - dragLast.x)/r.width)*2;
      panY -= ((e.clientY - dragLast.y)/r.height)*2;
      dragLast = { x:e.clientX, y:e.clientY };
      clampView(); applyView();
    }
  }
});
function endPointer(e){
  const wasTap = gesture === 'tap' && !moved && pointers.size === 1;
  pointers.delete(e.pointerId);
  if (wasTap) handleTap(e.clientX, e.clientY);
  if (pointers.size === 0){ gesture = 'idle'; pinchStart = null; }
  else if (pointers.size === 1){                       // ピンチ→片指：タップにはしない
    const p = [...pointers.values()][0];
    tapStart = { x:p.x, y:p.y }; dragLast = { x:p.x, y:p.y };
    gesture = 'drag'; moved = true;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
// ホイールでも拡大（PC・動作確認用）。カーソル位置を中心に拡大する。
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const m = ndcOf(e.clientX, e.clientY), zo = zoom;
  const zn = clamp(zoom * Math.exp(-e.deltaY * 0.0015), 1, 3);
  panX += (1 - zn/zo) * (m.x - panX);
  panY += (1 - zn/zo) * (m.y - panY);
  zoom = zn; clampView(); applyView();
}, { passive:false });
$('handBottom').addEventListener('click', e => {
  if (over || thinking || anim || pos.turn !== humanColor) return;
  const k = e.target.closest('.koma'); if (!k || k.dataset.pt === undefined) return;
  const pt = +k.dataset.pt;
  if (selected && selected.kind==='hand' && selected.pt===pt){ clearSelection(); hlDirty=true; renderStatus(); return; }
  selectHand(pt);
});
// 押しても着手しない。選んだ側を盤に出して見比べ、決定ボタンで初めて指す。
function pickPromo(which){
  promoPick = which;
  $('promoYes').classList.toggle('pick', which === 'yes');
  $('promoNo').classList.toggle('pick', which === 'no');
  $('promoGo').disabled = false;
  hlDirty = true;
}
$('promoYes').addEventListener('click', () => pickPromo('yes'));
$('promoNo').addEventListener('click', () => pickPromo('no'));
$('promoGo').addEventListener('click', () => {
  const want = promoPick === 'yes';
  const mv = pendingPromo.find(m => !!movePro(m) === want);
  closePromo();
  if (mv !== undefined) humanPlay(mv);
});
$('resultClose').addEventListener('click', () => $('resultOv').classList.remove('on'));
$('resultTitle').addEventListener('click', () => { location.href = './index.html'; });
$('resign').addEventListener('click', () => {
  if (over) return; over = true; thinking = false; hlDirty = true;
  closePromo();                                 // 成り確認の途中で投了しても盤の表示と選択を残さない
  showResult('あなたの負け', 'あなたの投了');
});
$('newGame').addEventListener('click', newGame);
$('reset').addEventListener('click', () => { zoom = 1; panX = 0; panY = 0; applyView(); });

/* ═════════ 新規対局 ═════════ */
function newGame(){
  // 手番と強さはタイトル画面から ?side= ?level= で渡る。無い・不正なら先手・ふつう。
  const q = new URLSearchParams(location.search);
  humanColor = q.get('side') === '1' ? WHITE : BLACK;
  level = ['easy','normal','hard'].includes(q.get('level')) ? q.get('level') : 'normal';
  flip = (humanColor === WHITE); placeScale();
  let sfen = START_SFEN;
  try { const s = q.get('sfen'); if (s){ parseSfen(s); sfen = s; } }
  catch { sfen = START_SFEN; }
  pos = parseSfen(sfen);
  legal = []; clearSelection(); lastMove = null;
  thinking = false; over = false; pendingPromo = null; anim = null;
  logLines = [];
  repKeys = [positionKey(pos)]; repChecks = [inCheck(pos)];
  $('resultOv').classList.remove('on'); closePromo();
  fallbackRun = 0; infoEl.textContent = '';
  npc.newGame();
  renderHands(); renderStatus(); renderLog();
  sceneDirty = true; hlDirty = true;
  if (pos.turn === humanColor){ legal = legalMoves(pos); renderStatus(); hlDirty = true; }
  else scheduleNpc();
}

/* ═════════ ループ ═════════ */
const clock = new THREE.Clock();
/* 待機モーションを進める。骨付きは各個体のミキサー、骨なし・箱は頂点揺れの時刻。 */
function updateAnims(dt){
  if (skinned){
    for (const name of POOL_NAMES){
      const hp = humanPools[name]; for (let i = 0; i < hp.active; i++) hp[i].mixer.update(dt);
      const op = oppPools[name];   for (let i = 0; i < op.active; i++) op[i].mixer.update(dt);
    }
  } else {
    uTime.value = clock.getElapsedTime();
  }
}
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateAnims(dt);
  if (anim){
    anim.t += dt / anim.dur; sceneDirty = true;
    if (anim.t >= 1){ const r = anim.resolve; anim = null; sceneDirty = true; hlDirty = true; renderStatus(); if (r) r(); }
  }
  if (sceneDirty){ layout(); sceneDirty = false; }
  if (hlDirty){ layoutHighlights(); hlDirty = false; }
  renderer.render(scene, camera);
}

resize();
newGame();
loop();
</script>
