<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>将棋 — 人間 対 NPC</title>
<style>
  :root{
    --ink:#e8e3d8; --dim:#8b8578; --line:rgba(232,227,216,.16);
    --hit:#c9a227; --bg:#0c0d0b; --panel:#111210;
    /* 盤の色 */
    --wood:#d9b473; --wood2:#cfa863; --grid:rgba(48,30,12,.55);
    --koma:#f3dca6; --koma2:#e6c684; --komak:#2a1c0d; --prom:#a5341f;
    --sz: min(94vw, 440px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  body{display:flex;flex-direction:column;align-items:center;
    padding:14px 10px 28px;gap:10px;min-height:100vh}
  h1{font-size:14px;font-weight:500;letter-spacing:.08em;margin:2px 0 0}
  h1 small{color:var(--dim);font-weight:400}

  /* 状態表示 */
  #status{width:var(--sz);min-height:22px;display:flex;justify-content:space-between;
    align-items:baseline;gap:10px;font-size:12px;color:var(--dim)}
  #turn{color:var(--ink)}
  #turn.check{color:#e0653f}
  #info{font-size:11px;color:var(--dim);text-align:right;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 持ち駒 */
  .hand{width:var(--sz);min-height:calc(var(--sz)/9 + 6px);
    display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:3px;
    border:1px solid var(--line);border-radius:4px;background:#0f100e}
  .hand.mine{border-color:rgba(201,162,39,.30)}
  .hand .empty{color:var(--dim);font-size:11px;padding:0 6px}

  /* 盤まわり */
  .area{display:grid;grid-template-columns:var(--sz) 15px;
    grid-template-rows:15px var(--sz);gap:2px}
  .files{grid-column:1;grid-row:1;display:grid;grid-template-columns:repeat(9,1fr)}
  .ranks{grid-column:2;grid-row:2;display:grid;grid-template-rows:repeat(9,1fr)}
  .files span,.ranks span{display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--dim)}
  .board{grid-column:1;grid-row:2;position:relative;
    width:var(--sz);height:var(--sz);
    display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);
    background:linear-gradient(160deg,var(--wood),var(--wood2));
    border:2px solid #6b4a22;border-radius:2px;
    box-shadow:0 6px 22px rgba(0,0,0,.45)}

  .cell{position:relative;border-right:1px solid var(--grid);
    border-bottom:1px solid var(--grid);display:flex;align-items:center;
    justify-content:center;cursor:default;-webkit-tap-highlight-color:transparent}
  .cell:nth-child(9n){border-right:none}
  .cell:nth-child(n+73){border-bottom:none}
  .board.playable .cell.movable{cursor:pointer}

  /* 駒（五角形のコマ） */
  .koma{width:86%;height:86%;display:flex;align-items:center;justify-content:center;
    font-weight:700;line-height:1;color:var(--komak);
    background:linear-gradient(#f6e3b2,var(--koma2));
    clip-path:polygon(50% 3%,86% 26%,86% 97%,14% 97%,14% 26%);
    box-shadow:0 1px 1px rgba(0,0,0,.3);
    font-size:calc(var(--sz)/16);font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
  .koma.gote{transform:rotate(180deg)}
  .koma.prom{color:var(--prom)}

  /* ハイライト */
  .cell.sel{background:rgba(201,162,39,.34)}
  .cell.last{background:rgba(201,162,39,.14)}
  .cell.check .koma{box-shadow:0 0 0 2px #e0653f, 0 1px 1px rgba(0,0,0,.3)}
  .cell.target::after{content:"";position:absolute;width:26%;height:26%;
    border-radius:50%;background:rgba(30,20,8,.45)}
  .cell.target.cap::after{width:78%;height:78%;background:none;border-radius:50%;
    border:3px solid rgba(160,40,20,.6)}

  /* 手駒の小さなコマ */
  .hkoma{position:relative;width:calc(var(--sz)/9 - 4px);height:calc(var(--sz)/9 - 4px);
    display:flex;align-items:center;justify-content:center;font-weight:700;
    color:var(--komak);background:linear-gradient(#f6e3b2,var(--koma2));
    clip-path:polygon(50% 3%,86% 26%,86% 97%,14% 97%,14% 26%);
    font-size:calc(var(--sz)/18);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    cursor:default}
  .hand.mine .hkoma{cursor:pointer}
  .hkoma.sel{outline:2px solid var(--hit);outline-offset:1px}
  .hkoma .n{position:absolute;right:-2px;bottom:-4px;font-size:10px;color:var(--hit);
    background:var(--bg);border-radius:6px;padding:0 3px;line-height:1.4;
    font-family:ui-monospace,monospace;transform:none}

  /* 操作 */
  .controls{width:var(--sz);display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .controls .grp{display:flex;gap:6px;flex:1;min-width:0}
  button,select{font:inherit;font-size:12px;color:var(--ink);background:#1a1b18;
    border:1px solid var(--line);border-radius:3px;padding:8px 6px;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  select{flex:1;min-width:0}
  button.primary{background:#2b2718;border-color:var(--hit);color:#f4e6ae;flex:1}
  button.ghost{flex:1}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible,select:focus-visible{outline:2px solid var(--hit);outline-offset:2px}

  /* 重ねる小窓（成り確認・結果） */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:10}
  .overlay.on{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:18px 18px 16px;max-width:300px;width:100%;text-align:center}
  .card p{margin:0 0 14px;font-size:13px}
  .card .big{font-size:16px;color:var(--hit);letter-spacing:.06em;margin-bottom:6px}
  .card .rowb{display:flex;gap:8px}
  .card .rowb button{flex:1}
  .hint{width:var(--sz);font-size:11px;color:var(--dim);text-align:center;margin-top:-2px}
</style>
</head>
<body>
  <h1>将棋 <small>— 人間 対 NPC（2D）</small></h1>

  <div id="status">
    <span id="turn">読み込み中…</span>
    <span id="info"></span>
  </div>

  <div class="hand" id="handTop"></div>

  <div class="area">
    <div class="files" id="files"></div>
    <div class="ranks" id="ranks"></div>
    <div class="board" id="board"></div>
  </div>

  <div class="hand mine" id="handBottom"></div>

  <div class="controls">
    <div class="grp">
      <select id="side" title="手番">
        <option value="0">あなた=先手（下）</option>
        <option value="1">あなた=後手（上）</option>
      </select>
      <select id="level" title="強さ">
        <option value="easy">やさしい</option>
        <option value="normal" selected>ふつう</option>
        <option value="hard">つよい</option>
      </select>
    </div>
    <div class="grp">
      <button class="primary" id="newGame">新規対局</button>
      <button class="ghost" id="resign">投了</button>
    </div>
  </div>
  <div class="hint">駒をタップ → 光ったマスへ。持ち駒もタップで打てます。</div>

  <!-- 成り確認 -->
  <div class="overlay" id="promoOv">
    <div class="card">
      <p>成りますか？</p>
      <div class="rowb">
        <button id="promoYes" class="primary">成る</button>
        <button id="promoNo">成らず</button>
      </div>
    </div>
  </div>

  <!-- 結果 -->
  <div class="overlay" id="resultOv">
    <div class="card">
      <p class="big" id="resultBig"></p>
      <p id="resultSub"></p>
      <button id="resultClose" class="primary">閉じる</button>
    </div>
  </div>

<script type="module">
import {
  START_SFEN, parseSfen, toSfen, legalMoves,
  doMove, moveToUsi, usiToMove,
  moveTo, moveFrom, isDrop, dropType,
  colorOf, typeOf, isProm, col, row, inCheck, positionKey, repetition,
  BLACK, WHITE, EMPTY,
  FU, KY, KE, GI, KI, KA, HI,
} from './src/shogi.js';
import { Npc } from './src/npc.js';

/* ───────── 表記 ───────── */
const KANJI = [];
KANJI[0]='歩'; KANJI[1]='香'; KANJI[2]='桂'; KANJI[3]='銀'; KANJI[4]='金';
KANJI[5]='角'; KANJI[6]='飛'; KANJI[7]='玉';
KANJI[8]='と'; KANJI[9]='杏'; KANJI[10]='圭'; KANJI[11]='全';
KANJI[13]='馬'; KANJI[14]='龍';
const RANK_KANJI = ['一','二','三','四','五','六','七','八','九'];
const HAND_ORDER = [HI, KA, KI, GI, KE, KY, FU];   // 表示順（飛→歩）

/* ───────── 参照 ───────── */
const $ = id => document.getElementById(id);
const boardEl = $('board'), filesEl = $('files'), ranksEl = $('ranks');
const handTop = $('handTop'), handBottom = $('handBottom');
const turnEl = $('turn'), infoEl = $('info');

/* ───────── 状態 ───────── */
const npc = new Npc();
let pos, humanColor, level, flip;
let legal = [];            // 人間手番のときの合法手一覧（ルール層から）
let selected = null;       // {kind:'board',sq} | {kind:'hand',pt} | null
let targets = new Map();   // to(マス) → そのマスへ至る合法手[]
let lastMove = null;       // {from,to} 直前の着手（打つ手は from=-1）
let thinking = false;
let over = false;
let cellBySq = [];

/* ───────── 盤の組み立て（先後で向きを変えるので毎回作り直す） ───────── */
function buildBoard(){
  boardEl.innerHTML=''; filesEl.innerHTML=''; ranksEl.innerHTML='';
  cellBySq = [];
  for (let drow = 0; drow < 9; drow++){
    for (let dcol = 0; dcol < 9; dcol++){
      const sq = flip ? (8 - drow) * 9 + (8 - dcol) : drow * 9 + dcol;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.sq = sq;
      boardEl.appendChild(cell);
      cellBySq[sq] = cell;
    }
  }
  // 筋（上）と段（右）のラベル
  for (let dcol = 0; dcol < 9; dcol++){
    const boardCol = flip ? 8 - dcol : dcol;
    const s = document.createElement('span'); s.textContent = 9 - boardCol;
    filesEl.appendChild(s);
  }
  for (let drow = 0; drow < 9; drow++){
    const boardRow = flip ? 8 - drow : drow;
    const s = document.createElement('span'); s.textContent = RANK_KANJI[boardRow];
    ranksEl.appendChild(s);
  }
}

/* ───────── 描画 ───────── */
function komaEl(piece, small){
  const t = typeOf(piece);
  const e = document.createElement('div');
  e.className = small ? 'hkoma' : 'koma';
  if (!small && colorOf(piece) !== humanColor) e.classList.add('gote');
  if (isProm(piece)) e.classList.add('prom');
  e.textContent = KANJI[t];
  return e;
}

function render(){
  const playable = !over && !thinking && pos.turn === humanColor;
  boardEl.classList.toggle('playable', playable);

  const checkSide = inCheck(pos) ? pos.turn : -1;         // 手番側が王手されているか

  for (let sq = 0; sq < 81; sq++){
    const cell = cellBySq[sq];
    cell.className = 'cell';
    cell.innerHTML = '';
    const p = pos.board[sq];
    if (p !== EMPTY){
      const k = komaEl(p, false);
      cell.appendChild(k);
      if (checkSide === colorOf(p) && typeOf(p) === 7) cell.classList.add('check');
    }
    // 直前の着手
    if (lastMove && (sq === lastMove.to || sq === lastMove.from)) cell.classList.add('last');
    // 選択と移動先
    if (selected && selected.kind === 'board' && selected.sq === sq) cell.classList.add('sel');
    if (playable && targets.has(sq)){
      cell.classList.add('target', 'movable');
      if (p !== EMPTY) cell.classList.add('cap');
    }
    // 自分の駒は掴めるように
    if (playable && p !== EMPTY && colorOf(p) === humanColor) cell.classList.add('movable');
  }

  renderHand(handTop, 1 - humanColor, false);
  renderHand(handBottom, humanColor, true);
  renderStatus(checkSide);
}

function renderHand(el, color, mine){
  el.innerHTML = '';
  let any = false;
  for (const t of HAND_ORDER){
    const n = pos.hands[color][t];
    if (!n) continue;
    any = true;
    const e = document.createElement('div');
    e.className = 'hkoma';
    e.textContent = KANJI[t];
    if (mine && selected && selected.kind === 'hand' && selected.pt === t) e.classList.add('sel');
    if (n > 1){ const b = document.createElement('span'); b.className='n'; b.textContent=n; e.appendChild(b); }
    if (mine){ e.dataset.pt = t; }
    el.appendChild(e);
  }
  if (!any){ const s = document.createElement('span'); s.className='empty'; s.textContent='なし'; el.appendChild(s); }
}

function renderStatus(checkSide){
  if (over) return;                      // 結果表示中は turnEl を書き換えない
  const my = pos.turn === humanColor;
  let t = thinking ? '敵軍の番…' : (my ? '自軍の番' : '敵軍の番');
  if (checkSide >= 0) t += '（王手）';
  // 王手中に、動かせる手のない駒を選んだら、その駒では受けられないことを知らせる
  if (checkSide === humanColor && selected && targets.size === 0) t = 'この駒では大将を守れません';
  turnEl.textContent = t;
  turnEl.classList.toggle('check', checkSide >= 0);
}

/* ───────── 選択と着手 ───────── */
function clearSelection(){ selected = null; targets = new Map(); }

function selectBoard(sq){
  const p = pos.board[sq];
  if (p === EMPTY || colorOf(p) !== humanColor) return;
  selected = { kind:'board', sq };
  targets = new Map();
  for (const mv of legal){
    if (!isDrop(mv) && moveFrom(mv) === sq){
      const to = moveTo(mv);
      (targets.get(to) || targets.set(to, []).get(to)).push(mv);
    }
  }
  render();
}

function selectHand(pt){
  if (!pos.hands[humanColor][pt]) return;
  selected = { kind:'hand', pt };
  targets = new Map();
  for (const mv of legal){
    if (isDrop(mv) && dropType(mv) === pt){
      const to = moveTo(mv);
      (targets.get(to) || targets.set(to, []).get(to)).push(mv);
    }
  }
  render();
}

/* 移動先タップ。成り／不成の両方が合法なら確認を挟む。 */
function chooseTarget(to){
  const cand = targets.get(to);
  if (!cand || !cand.length) return;
  if (cand.length === 1){ applyHumanMove(cand[0]); return; }
  // 2手＝成りと不成。確認する。
  pendingPromo = cand;
  $('promoOv').classList.add('on');
}
let pendingPromo = null;
let repKeys = [], repChecks = [];        // 千日手の照合用。開始局面から毎手の局面キーと王手の有無
function recordPosition(){ repKeys.push(positionKey(pos)); repChecks.push(inCheck(pos)); }

function applyHumanMove(mv){
  clearSelection();
  const from = isDrop(mv) ? -1 : moveFrom(mv);
  doMove(pos, mv); recordPosition();
  lastMove = { from, to: moveTo(mv) };
  const sfen = toSfen(pos);
  npc.moved(sfen);
  render();
  // 相手（NPC）が指せなければ人間の勝ち。
  if (checkTerminalAfterMove('あなた')) return;
  scheduleNpc();
}

/* ───────── NPC ───────── */
async function scheduleNpc(){
  thinking = true;
  legal = [];
  render();
  const sfen = toSfen(pos);
  let res;
  try { res = await npc.think(sfen, level); }
  catch { res = null; }
  thinking = false;

  // 待っている間に投了・新規対局で局面が変わっていたら、この応答は破棄する
  if (over || toSfen(pos) !== sfen){ return; }

  let usi = res && res.usi;
  const legalNow = legalMoves(pos);
  const legalUsi = new Set(legalNow.map(moveToUsi));
  let note = '';
  if (usi && legalUsi.has(usi)){
    note = res.fallback ? '退避手' : `worker d${res.depth ?? '?'} ${res.ms ?? '?'}ms`;
  } else {
    // Worker が応答しない／非合法を返したときの最終防衛。ルール層の合法手から選ぶ。
    if (legalNow.length === 0){ over = true; showResult('あなたの勝ち', 'NPC は指す手がありません'); return; }
    usi = moveToUsi(legalNow[Math.floor(Math.random() * legalNow.length)]);
    note = '退避手';
  }

  const mv = usiToMove(usi);
  const from = isDrop(mv) ? -1 : moveFrom(mv);
  doMove(pos, mv); recordPosition();
  lastMove = { from, to: moveTo(mv) };
  npc.moved(toSfen(pos));
  infoEl.textContent = `NPC: ${usi}（${note}）`;

  if (checkTerminalAfterMove('NPC')) return;
  // 人間の手番へ
  legal = legalMoves(pos);
  render();
}

/* 直前に mover が指した後、手番側に合法手が無ければ決着。千日手も見る。 */
function checkTerminalAfterMove(mover){
  const next = legalMoves(pos);
  if (next.length === 0){
    over = true;
    render();
    const checked = inCheck(pos);
    const winnerIsHuman = (mover === 'あなた');
    const how = checked ? '詰み' : '手詰まり';
    showResult(winnerIsHuman ? 'あなたの勝ち' : 'あなたの負け', `${mover}の勝ち（${how}）`);
    return true;
  }
  const rep = repetition(repKeys, repChecks);
  if (rep !== null){
    over = true;
    render();
    if (rep === 'draw') showResult('引き分け', '同じ局面が4回くり返されたため（千日手）');
    else showResult(rep === humanColor ? 'あなたの負け' : 'あなたの勝ち',
                    `${rep === humanColor ? 'NPC' : 'あなた'}の勝ち。同じ局面のくり返し（千日手・連続王手）`);
    return true;
  }
  render(); return false;
}

/* ───────── 結果表示 ───────── */
function showResult(big, sub){
  $('resultBig').textContent = big;
  $('resultSub').textContent = sub;
  $('resultOv').classList.add('on');
  turnEl.textContent = big;
  turnEl.classList.remove('check');
}

/* ───────── 入力 ───────── */
boardEl.addEventListener('click', (e) => {
  if (over || thinking || pos.turn !== humanColor) return;
  const cell = e.target.closest('.cell');
  if (!cell) return;
  const sq = +cell.dataset.sq;
  if (targets.has(sq)){ chooseTarget(sq); return; }   // 移動先を確定
  const p = pos.board[sq];
  if (p !== EMPTY && colorOf(p) === humanColor){ selectBoard(sq); return; }
  clearSelection(); render();                          // 空マス等はキャンセル
});

handBottom.addEventListener('click', (e) => {
  if (over || thinking || pos.turn !== humanColor) return;
  const k = e.target.closest('.hkoma');
  if (!k || k.dataset.pt === undefined) return;
  const pt = +k.dataset.pt;
  if (selected && selected.kind === 'hand' && selected.pt === pt){ clearSelection(); render(); return; }
  selectHand(pt);
});

$('promoYes').addEventListener('click', () => {
  $('promoOv').classList.remove('on');
  const mv = pendingPromo.find(m => (m >> 14) & 1);   // 成る手
  pendingPromo = null;
  if (mv !== undefined) applyHumanMove(mv);
});
$('promoNo').addEventListener('click', () => {
  $('promoOv').classList.remove('on');
  const mv = pendingPromo.find(m => !((m >> 14) & 1)); // 不成
  pendingPromo = null;
  if (mv !== undefined) applyHumanMove(mv);
});

$('resultClose').addEventListener('click', () => $('resultOv').classList.remove('on'));

$('resign').addEventListener('click', () => {
  if (over) return;
  over = true; thinking = false;
  render();
  showResult('あなたの負け', 'あなたの投了');
});

$('newGame').addEventListener('click', newGame);

/* ───────── 新規対局 ───────── */
function newGame(){
  humanColor = +$('side').value;
  level = $('level').value;
  flip = (humanColor === WHITE);           // 後手なら盤を反転して自分を下に
  // 任意の開始局面を ?sfen= で渡せる（詰将棋や局面共有・検証用）。
  // 与えられなければ通常の初期局面。解釈に失敗したら初期局面へ退避。
  let sfen = START_SFEN;
  try {
    const q = new URLSearchParams(location.search).get('sfen');
    if (q){ parseSfen(q); sfen = q; }      // parseSfen が通れば採用
  } catch { sfen = START_SFEN; }
  pos = parseSfen(sfen);
  legal = []; clearSelection(); lastMove = null;
  thinking = false; over = false; pendingPromo = null;
  repKeys = [positionKey(pos)]; repChecks = [inCheck(pos)];
  $('resultOv').classList.remove('on');
  $('promoOv').classList.remove('on');
  infoEl.textContent = '';
  npc.newGame();
  buildBoard();
  if (pos.turn === humanColor){
    legal = legalMoves(pos);
    render();
  } else {
    render();
    scheduleNpc();                          // 先に NPC が指す
  }
}

newGame();
</script>
</body>
</html>
